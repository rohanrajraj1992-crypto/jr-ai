<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#080d18">
<title>JR - AI | Login</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;min-height:100%;font-family:Georgia,"Times New Roman",serif}
body{min-height:100vh;min-height:100dvh;color:#f3f4f7;background:radial-gradient(circle at 18% 10%,#2b3c59 0,#151f32 30%,#080d17 72%);display:flex;justify-content:center;align-items:center;padding:16px 14px;overflow-x:hidden;position:relative;isolation:isolate}
body::before,body::after{content:"";position:fixed;width:190px;height:190px;border-radius:50%;filter:blur(40px);pointer-events:none;z-index:-1}
body::before{left:-95px;top:4%;background:rgba(95,135,200,.22);animation:orbOne 11s ease-in-out infinite alternate}
body::after{right:-95px;bottom:4%;background:rgba(100,125,190,.17);animation:orbTwo 13s ease-in-out infinite alternate}
.page{position:relative;z-index:1;width:100%;max-width:440px;text-align:center;margin:auto;padding:10px 0}
.brand{margin-bottom:26px;animation:fadeIn .7s ease both}
.welcome{font-size:12px;letter-spacing:5px;font-weight:bold;color:#b9c1d0;margin-bottom:7px}
.logo{font-size:44px;letter-spacing:4px;font-weight:900;line-height:1.1;color:#f4f5f8;animation:premiumLogo 4s ease-in-out infinite}
.tagline{font-size:15px;letter-spacing:1.8px;font-weight:bold;color:#aeb6c6;margin-top:8px;font-variant:small-caps}
.card{position:relative;overflow:hidden;width:100%;padding:25px 22px 24px;border:1px solid rgba(145,166,202,.2);border-radius:30px;background:linear-gradient(145deg,rgba(20,29,46,.96),rgba(10,16,29,.97));box-shadow:0 18px 45px rgba(0,0,0,.32),inset 0 1px 1px rgba(255,255,255,.07);backdrop-filter:blur(14px);animation:fadeIn .8s .08s ease both}
.card::before{content:"";position:absolute;top:0;left:-120%;width:75%;height:2px;background:linear-gradient(90deg,transparent,rgba(210,229,255,.85),rgba(130,170,230,.45),transparent);box-shadow:0 0 18px rgba(150,190,255,.3);animation:cardLightSweep 7s ease-in-out infinite;pointer-events:none;z-index:2}
.card::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;box-shadow:inset 0 0 35px rgba(96,124,165,.035)}
.tabs{display:flex;background:rgba(5,9,18,.66);border-radius:17px;padding:5px;margin-bottom:25px;box-shadow:0 7px 18px rgba(0,0,0,.3);gap:4px}
.tab{flex:1;min-width:0;border:0;background:transparent;color:#7c859a;padding:12px 4px;min-height:44px;border-radius:13px;font:700 15px Georgia,"Times New Roman",serif;font-variant:small-caps;cursor:pointer;transition:color .2s,background .2s}
.tab.active{color:#fff;background:linear-gradient(135deg,#27354c,#202c42);box-shadow:0 5px 15px rgba(0,0,0,.35)}
.form{text-align:left}.group{margin-bottom:18px}
label{display:block;color:#c0c6d2;font-size:14px;font-weight:bold;font-variant:small-caps;letter-spacing:.3px;margin:0 0 8px 2px}
input{display:block;width:100%;height:51px;padding:0 15px;border:1px solid #29364d;border-radius:17px;background:rgba(7,13,24,.78);color:#fff;outline:0;font:700 14px Georgia,"Times New Roman",serif;letter-spacing:.2px;transition:border-color .2s,box-shadow .2s}
input:focus{border-color:#7589aa;box-shadow:0 0 0 3px rgba(130,150,185,.1)}
input::placeholder{color:#687287}.password-wrap{position:relative}.password-wrap input{padding-right:53px}
.eye{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;background:transparent;color:#aab2c1;font-size:17px;cursor:pointer}
.forgot{display:block;margin:-4px 2px 16px auto;border:0;background:none;color:#9aafd1;font:700 12px Georgia,serif;cursor:pointer}
.main-btn{position:relative;overflow:hidden;display:block;width:100%;height:53px;border:0;border-radius:17px;background:linear-gradient(135deg,#f4f6fb,#b3bdcd);color:#080d17;font:900 17px Georgia,"Times New Roman",serif;font-variant:small-caps;letter-spacing:.7px;cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.24),inset 0 1px 0 rgba(255,255,255,.65);transition:opacity .2s,transform .2s}
.main-btn::before{content:"";position:absolute;top:0;left:-120%;width:65%;height:100%;background:linear-gradient(105deg,transparent,rgba(255,255,255,.48),transparent);transform:skewX(-20deg);animation:buttonLightSweep 6s ease-in-out infinite;pointer-events:none}
.main-btn:active{transform:scale(.99)}.main-btn:disabled{opacity:.65;cursor:not-allowed}.forgot:disabled{opacity:.6;cursor:wait}
.message{display:none;margin:13px 4px 0;text-align:center;font-size:12px;font-weight:bold;line-height:1.5;font-variant:small-caps;overflow-wrap:anywhere}
.message.show{display:block}.message.success{color:#8fe0af}.message.error{color:#ee9696}
.security{margin:19px 8px 0;color:#59647a;font-size:11px;font-weight:bold;line-height:1.6;font-variant:small-caps;letter-spacing:.3px}
.footer{margin-top:20px;color:#59647a;font-size:10px;font-weight:bold;font-variant:small-caps;line-height:1.5}.hidden{display:none!important}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes premiumLogo{0%,100%{transform:perspective(500px) rotateX(0) translateY(0);text-shadow:0 3px 12px rgba(190,215,255,.08)}50%{transform:perspective(500px) rotateX(3deg) translateY(-2px);text-shadow:0 5px 24px rgba(160,195,255,.25)}}
@keyframes cardLightSweep{0%,20%{left:-120%;opacity:0}35%{opacity:1}65%,100%{left:150%;opacity:0}}
@keyframes buttonLightSweep{0%,55%{left:-120%;opacity:0}68%{opacity:1}88%,100%{left:150%;opacity:0}}
@keyframes orbOne{from{transform:translate(0,0) scale(1)}to{transform:translate(35px,45px) scale(1.18)}}
@keyframes orbTwo{from{transform:translate(0,0) scale(1)}to{transform:translate(-35px,-35px) scale(1.15)}}
@media(max-width:380px){.page{padding:5px 0}.brand{margin-bottom:21px}.welcome{font-size:11px;letter-spacing:4.5px}.logo{font-size:39px}.tagline{font-size:13px}.card{padding:22px 17px 21px;border-radius:26px}.tabs{margin-bottom:22px}.tab{font-size:13px;min-height:42px;padding:10px 3px}input{height:48px;font-size:13px}.main-btn{height:50px;font-size:16px}.security{font-size:10px}}
@media(min-width:601px){body{padding:24px}.page{max-width:440px}.brand{margin-bottom:25px}.logo{font-size:48px}.card{padding:27px 25px}.tab{font-size:16px}.group{margin-bottom:19px}input{height:55px;font-size:15px}.main-btn{height:56px;font-size:18px}.security{font-size:12px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="page">
  <div class="brand"><div class="welcome">WELCOME TO</div><div class="logo">JR - AI</div><div class="tagline">LEARN • ASK • CREATE</div></div>
  <div class="card">
    <div class="tabs"><button class="tab active" id="loginTab" type="button">Log In</button><button class="tab" id="signupTab" type="button">Create Account</button></div>
    <form id="loginForm" class="form">
      <div class="group"><label for="loginEmail">Email Address</label><input id="loginEmail" type="email" placeholder="Enter your email" autocomplete="email" required></div>
      <div class="group"><label for="loginPassword">Password</label><div class="password-wrap"><input id="loginPassword" type="password" placeholder="Enter your password" autocomplete="current-password" required><button class="eye" id="loginEye" type="button" aria-label="Show or hide password">👁</button></div></div>
      <button class="forgot" id="forgotBtn" type="button">Forgot Password?</button><button class="main-btn" id="loginBtn" type="submit">LOG IN</button>
      <div class="message" id="loginMessage" role="status" aria-live="polite"></div>
    </form>
    <form id="signupForm" class="form hidden">
      <div class="group"><label for="signupName">Full Name</label><input id="signupName" type="text" placeholder="Enter your name" autocomplete="name" required></div>
      <div class="group"><label for="signupEmail">Email Address</label><input id="signupEmail" type="email" placeholder="Enter your email" autocomplete="email" required></div>
      <div class="group"><label for="signupPassword">Password</label><div class="password-wrap"><input id="signupPassword" type="password" placeholder="Create a password" autocomplete="new-password" minlength="6" required><button class="eye" id="signupEye" type="button" aria-label="Show or hide password">👁</button></div></div>
      <div class="group"><label for="signupConfirm">Confirm Password</label><div class="password-wrap"><input id="signupConfirm" type="password" placeholder="Confirm your password" autocomplete="new-password" minlength="6" required><button class="eye" id="confirmEye" type="button" aria-label="Show or hide password">👁</button></div></div>
      <button class="main-btn" id="signupBtn" type="submit">CREATE ACCOUNT</button><div class="message" id="signupMessage" role="status" aria-live="polite"></div>
    </form>
    <div class="security">Your account is securely managed by Firebase Authentication.</div>
  </div>
  <div class="footer">© JR - AI • YOUR LEARNING COMPANION</div>
</div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,sendPasswordResetEmail,updateProfile} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

const firebaseConfig={apiKey:"AIzaSyCPMj0rPve60XPUanyUCXYAUVcUSiuwIpE",authDomain:"jr-ai-bb664.firebaseapp.com",projectId:"jr-ai-bb664",storageBucket:"jr-ai-bb664.firebasestorage.app",messagingSenderId:"769516066165",appId:"1:769516066165:web:eabf9c49c713d1b9b0af3c"};
const auth=getAuth(initializeApp(firebaseConfig));
const $=id=>document.getElementById(id);
const loginTab=$("loginTab"),signupTab=$("signupTab"),loginForm=$("loginForm"),signupForm=$("signupForm"),loginBtn=$("loginBtn"),signupBtn=$("signupBtn"),loginMessage=$("loginMessage"),signupMessage=$("signupMessage");
const MAX_ATTEMPTS=5,LOCK_TIME=15*60*1000;

function showMessage(el,text,type){el.textContent=text;el.className="message show "+type}
function clearMessages(){loginMessage.className="message";signupMessage.className="message"}
function switchTab(which){clearMessages();const isLogin=which==="login";loginTab.classList.toggle("active",isLogin);signupTab.classList.toggle("active",!isLogin);loginForm.classList.toggle("hidden",!isLogin);signupForm.classList.toggle("hidden",isLogin)}
loginTab.addEventListener("click",()=>switchTab("login"));signupTab.addEventListener("click",()=>switchTab("signup"));
function togglePassword(inputId,buttonId){const input=$(inputId),button=$(buttonId);button.addEventListener("click",()=>{const show=input.type==="password";input.type=show?"text":"password";button.textContent=show?"🙈":"👁"})}
togglePassword("loginPassword","loginEye");togglePassword("signupPassword","signupEye");togglePassword("signupConfirm","confirmEye");

function firebaseError(error){switch(error.code){
case "auth/invalid-credential":case "auth/wrong-password":case "auth/user-not-found":return "Email or password is incorrect.";
case "auth/email-already-in-use":return "This email is already registered. Please log in.";
case "auth/invalid-email":return "Please enter a valid email address.";
case "auth/weak-password":return "Password should be at least 6 characters.";
case "auth/user-disabled":return "This account has been disabled.";
case "auth/too-many-requests":return "Firebase has temporarily limited requests. Please try again later.";
case "auth/network-request-failed":return "Network problem. Check your internet connection.";
default:return "Something went wrong. Please try again."}}

function attemptKey(email){return "jr_login_attempts_"+email.trim().toLowerCase()}
function getAttemptData(email){try{const raw=localStorage.getItem(attemptKey(email)),data=raw?JSON.parse(raw):null;if(!data||!Number.isInteger(data.count)||typeof data.lockUntil!=="number")return {count:0,lockUntil:0};return data}catch{return {count:0,lockUntil:0}}}
function saveAttemptData(email,data){try{localStorage.setItem(attemptKey(email),JSON.stringify(data))}catch{}}
function clearAttemptData(email){try{localStorage.removeItem(attemptKey(email))}catch{}}

/* Basic browser-side counter only; it is not secure server-side rate limiting. */
loginForm.addEventListener("submit",async e=>{
e.preventDefault();clearMessages();
const email=$("loginEmail").value.trim(),password=$("loginPassword").value;
if(!email||!password)return;
let data=getAttemptData(email),now=Date.now();
if(data.lockUntil>now){const minutes=Math.ceil((data.lockUntil-now)/60000);showMessage(loginMessage,`Too many failed attempts. Try again in ${minutes} minute(s).`,"error");return}
if(data.lockUntil&&data.lockUntil<=now){data={count:0,lockUntil:0};saveAttemptData(email,data)}
loginBtn.disabled=true;loginBtn.textContent="LOGGING IN...";
try{await signInWithEmailAndPassword(auth,email,password);clearAttemptData(email);showMessage(loginMessage,"Login successful. Opening JR AI...","success")}
catch(error){
const wrongCodes=["auth/invalid-credential","auth/wrong-password","auth/user-not-found"];
if(wrongCodes.includes(error.code)){data.count+=1;if(data.count>=MAX_ATTEMPTS){data.lockUntil=Date.now()+LOCK_TIME;saveAttemptData(email,data);showMessage(loginMessage,"5 failed attempts reached. Please try again after 15 minutes.","error")}else{saveAttemptData(email,data);showMessage(loginMessage,`Email or password is incorrect. ${MAX_ATTEMPTS-data.count} attempt(s) remaining.`,"error")}}
else showMessage(loginMessage,firebaseError(error),"error");
loginBtn.disabled=false;loginBtn.textContent="LOG IN";
}});

signupForm.addEventListener("submit",async e=>{
e.preventDefault();clearMessages();
const name=$("signupName").value.trim(),email=$("signupEmail").value.trim(),password=$("signupPassword").value,confirm=$("signupConfirm").value;
if(password!==confirm){showMessage(signupMessage,"Passwords do not match.","error");return}
signupBtn.disabled=true;signupBtn.textContent="CREATING...";
try{const result=await createUserWithEmailAndPassword(auth,email,password);await updateProfile(result.user,{displayName:name});showMessage(signupMessage,"Account created successfully. Opening JR AI...","success")}
catch(error){showMessage(signupMessage,firebaseError(error),"error");signupBtn.disabled=false;signupBtn.textContent="CREATE ACCOUNT"}
});

$("forgotBtn").addEventListener("click",async()=>{
clearMessages();const email=$("loginEmail").value.trim();
if(!email){showMessage(loginMessage,"Enter your email address first.","error");return}
const button=$("forgotBtn");button.disabled=true;
try{await sendPasswordResetEmail(auth,email);showMessage(loginMessage,"If an account exists for this email, a reset email will be sent.","success")}
catch(error){showMessage(loginMessage,firebaseError(error),"error")}
finally{button.disabled=false}
});
onAuthStateChanged(auth,user=>{if(user)window.location.replace("index.html")});
</script>
</body>
</html>
