<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mystery House | JR AI Book Store</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f7fb;
  color:#172033;
  min-height:100vh;
  transition:background .25s,color .25s;
}

body.dark{
  background:#101522;
  color:#f1f5f9;
}

/* HEADER */

.header{
  position:sticky;
  top:0;
  z-index:1000;
  height:64px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  background:#111827;
  color:white;
  box-shadow:0 4px 18px rgba(0,0,0,.18);
}

.header-left{
  display:flex;
  align-items:center;
  gap:10px;
}

.back-btn,
.theme-btn{
  border:none;
  background:#263244;
  color:white;
  width:40px;
  height:40px;
  border-radius:12px;
  font-size:19px;
  cursor:pointer;
}

.header-title{
  font-size:18px;
  font-weight:800;
}

/* COVER */

.cover{
  margin:18px auto;
  width:calc(100% - 28px);
  max-width:900px;
  min-height:230px;
  border-radius:24px;
  padding:28px 22px;
  display:flex;
  align-items:center;
  gap:22px;
  color:white;
  background:
    radial-gradient(circle at top right,#334155 0,#111827 48%,#020617 100%);
  box-shadow:0 14px 35px rgba(0,0,0,.22);
}

.cover-icon{
  width:125px;
  height:160px;
  flex-shrink:0;
  border-radius:16px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:64px;
  background:linear-gradient(145deg,#1e293b,#020617);
  border:1px solid rgba(255,255,255,.15);
  box-shadow:0 12px 25px rgba(0,0,0,.3);
}

.cover-info h1{
  font-size:31px;
  margin-bottom:10px;
}

.cover-info p{
  color:#cbd5e1;
  line-height:1.6;
  font-size:15px;
}

/* SEARCH */

.search-wrap{
  width:calc(100% - 28px);
  max-width:900px;
  margin:0 auto 18px;
}

.search-box{
  width:100%;
  height:50px;
  border:1px solid #d6dce6;
  border-radius:16px;
  padding:0 16px;
  font-size:15px;
  outline:none;
  background:white;
  color:#172033;
  box-shadow:0 5px 16px rgba(15,23,42,.06);
}

.search-box:focus{
  border-color:#64748b;
}

body.dark .search-box{
  background:#1a2232;
  color:#f8fafc;
  border-color:#334155;
}

/* CHAPTER SECTION */

.chapter-section{
  width:calc(100% - 28px);
  max-width:900px;
  margin:0 auto 30px;
}

.section-heading{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:14px;
}

.section-heading h2{
  font-size:22px;
}

.chapter-count{
  font-size:13px;
  color:#64748b;
}

body.dark .chapter-count{
  color:#94a3b8;
}

.chapter-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}

.chapter-card{
  background:white;
  border:1px solid #e2e8f0;
  border-radius:18px;
  padding:16px;
  min-height:150px;
  box-shadow:0 7px 20px rgba(15,23,42,.06);
  transition:transform .2s,box-shadow .2s;
}

.chapter-card:hover{
  transform:translateY(-2px);
  box-shadow:0 12px 26px rgba(15,23,42,.1);
}

body.dark .chapter-card{
  background:#182131;
  border-color:#2d3a4d;
  box-shadow:none;
}

.chapter-number{
  width:38px;
  height:38px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:12px;
  background:#e2e8f0;
  color:#1e293b;
  font-weight:800;
  margin-bottom:12px;
}

body.dark .chapter-number{
  background:#293548;
  color:#e2e8f0;
}

.chapter-card h3{
  font-size:16px;
  line-height:1.4;
  margin-bottom:12px;
}

.read-btn{
  border:none;
  background:#1e293b;
  color:white;
  padding:9px 13px;
  border-radius:11px;
  font-size:13px;
  font-weight:700;
  cursor:pointer;
}

.read-btn:hover{
  background:#334155;
}

.no-result{
  display:none;
  padding:30px;
  text-align:center;
  color:#64748b;
  background:white;
  border-radius:18px;
}

body.dark .no-result{
  background:#182131;
  color:#94a3b8;
}

/* READER */

.reader{
  display:none;
  width:calc(100% - 28px);
  max-width:900px;
  margin:0 auto 35px;
}

.reader.active{
  display:block;
}

.reader-top{
  background:white;
  border:1px solid #e2e8f0;
  border-radius:20px;
  padding:20px;
  margin-bottom:14px;
  box-shadow:0 7px 20px rgba(15,23,42,.06);
}

body.dark .reader-top{
  background:#182131;
  border-color:#2d3a4d;
  box-shadow:none;
}

.reader-top h2{
  font-size:24px;
  line-height:1.35;
  margin-bottom:8px;
}

.reader-top p{
  color:#64748b;
  font-size:14px;
}

body.dark .reader-top p{
  color:#94a3b8;
}

.reader-content{
  background:white;
  border:1px solid #e2e8f0;
  border-radius:20px;
  padding:22px;
  line-height:1.8;
  font-size:16px;
  box-shadow:0 7px 20px rgba(15,23,42,.06);
}

body.dark .reader-content{
  background:#182131;
  border-color:#2d3a4d;
  box-shadow:none;
}

.reader-content p{
  margin-bottom:18px;
}

.reader-content h3{
  margin:26px 0 14px;
  font-size:21px;
}

.dialogue{
  margin:20px 0;
  padding:15px 18px;
  border-left:4px solid #475569;
  background:#f1f5f9;
  border-radius:12px;
  font-weight:700;
  font-style:italic;
}

body.dark .dialogue{
  background:#222c3c;
  border-left-color:#94a3b8;
}

/* NAVIGATION */

.navigation{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:10px;
  margin-top:15px;
}

.navigation button{
  min-height:46px;
  border:none;
  border-radius:13px;
  background:#1e293b;
  color:white;
  font-weight:700;
  cursor:pointer;
  padding:8px;
}

.navigation button:hover{
  background:#334155;
}

.navigation button:disabled{
  opacity:.4;
  cursor:not-allowed;
}

.progress-wrap{
  margin-top:15px;
  text-align:center;
}

.progress-bar{
  width:100%;
  height:8px;
  border-radius:20px;
  overflow:hidden;
  background:#dbe2ea;
}

body.dark .progress-bar{
  background:#2d3748;
}

.progress-fill{
  height:100%;
  width:0;
  background:#475569;
  border-radius:20px;
  transition:width .25s;
}

.progress-text{
  margin-top:8px;
  font-size:13px;
  color:#64748b;
}

body.dark .progress-text{
  color:#94a3b8;
}

/* FOOTER */

.footer{
  text-align:center;
  padding:25px 15px 35px;
  color:#64748b;
  font-size:13px;
}

body.dark .footer{
  color:#94a3b8;
}

/* MOBILE */

@media(max-width:600px){

  .header{
    height:60px;
  }

  .header-title{
    font-size:16px;
  }

  .cover{
    min-height:190px;
    padding:20px 16px;
    gap:15px;
  }

  .cover-icon{
    width:90px;
    height:125px;
    font-size:46px;
  }

  .cover-info h1{
    font-size:23px;
  }

  .cover-info p{
    font-size:13px;
  }

  .chapter-grid{
    grid-template-columns:1fr;
  }

  .reader-content{
    padding:18px;
    font-size:15px;
  }

  .reader-top h2{
    font-size:21px;
  }

  .navigation button{
    font-size:12px;
  }
}
</style>
</head>

</section>


<footer class="footer">

const chapterGrid =
  document.getElementById("chapterGrid");

const chapterSection =
  document.getElementById("chapterSection");

const reader =
  document.getElementById("reader");

const readerTitle =
  document.getElementById("readerTitle");

const readerContent =
  document.getElementById("readerContent");

const searchInput =
  document.getElementById("searchInput");

const chapterCount =
  document.getElementById("chapterCount");

const noResult =
  document.getElementById("noResult");

const prevBtn =
  document.getElementById("prevBtn");

const nextBtn =
  document.getElementById("nextBtn");

const progressFill =
  document.getElementById("progressFill");

const progressText =
  document.getElementById("progressText");


let currentIndex = 0;


function renderChapters(list){

  chapterGrid.innerHTML = "";

  chapterCount.textContent =
    `${list.length} Chapter${list.length === 1 ? "" : "s"}`;

  if(list.length === 0){

    noResult.style.display = "block";

    return;
  }

  noResult.style.display = "none";


  list.forEach(function(chapter){

    const originalIndex =
      chapters.indexOf(chapter);

    const card =
      document.createElement("div");

    card.className =
      "chapter-card";


    card.innerHTML = `

      <div class="chapter-number">
        ${originalIndex + 1}
      </div>

      <h3>
        ${chapter.title}
      </h3>

      <button
        class="read-btn"
        type="button"
        onclick="openChapter(${originalIndex})"
      >
        Read Chapter
      </button>

    `;


    chapterGrid.appendChild(card);

  });

}


function openChapter(index){

  if(
    index < 0 ||
    index >= chapters.length
  ){
    return;
  }


  currentIndex = index;


  chapterSection.style.display =
    "none";

  reader.classList.add("active");


  readerTitle.textContent =
    `Chapter ${currentIndex + 1}: ${chapters[currentIndex].title}`;


  readerContent.innerHTML =
    chapters[currentIndex].content;


  updateNavigation();


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


function showChapters(){

  reader.classList.remove("active");

  chapterSection.style.display =
    "block";

  searchInput.focus();


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


function previousChapter(){

  if(currentIndex > 0){

    openChapter(
      currentIndex - 1
    );

  }

}


function nextChapter(){

  if(
    currentIndex <
    chapters.length - 1
  ){

    openChapter(
      currentIndex + 1
    );

  }

}


function updateNavigation(){

  const total =
    chapters.length;

  const current =
    currentIndex + 1;


  progressText.textContent =
    `Chapter ${current} of ${total}`;


  const percentage =
    (current / total) * 100;


  progressFill.style.width =
    percentage + "%";


  prevBtn.disabled =
    currentIndex === 0;


  nextBtn.disabled =
    currentIndex === total - 1;

}


function searchChapters(){

  const query =
    searchInput.value
      .trim()
      .toLowerCase();


  if(query === ""){

    renderChapters(chapters);

    return;
  }


  const filtered =
    chapters.filter(function(chapter){

      const title =
        chapter.title.toLowerCase();

      const content =
        chapter.content.toLowerCase();

      return(
        title.includes(query) ||
        content.includes(query)
      );

    });


  renderChapters(filtered);

}


function toggleTheme(){

  document.body.classList.toggle("dark");


  const theme =
    document.body.classList.contains("dark")
      ? "dark"
      : "light";


  localStorage.setItem(
    "jr_ai_theme",
    theme
  );

}


function loadTheme(){

  const savedTheme =
    localStorage.getItem(
      "jr_ai_theme"
    );


  if(savedTheme=== "dark"){

    document.body.classList.add("dark");

  }

}


searchInput.addEventListener(
  "input",
  searchChapters
);


loadTheme();

renderChapters(chapters);

updateNavigation();

</script>
