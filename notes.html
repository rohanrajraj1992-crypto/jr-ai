<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>
<title>JR AI - Make Notes</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  height: 100%;
  font-family: Arial, sans-serif;
  background: #c6c6c6;
}

.app {
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* HEADER */

.header {
  height: 58px;
  min-height: 58px;
  background: #999999;
  display: flex;
  align-items: center;
  padding: 0 12px;
  font-weight: bold;
}

.back-btn {
  border: none;
  background: transparent;
  font-size: 28px;
  cursor: pointer;
  margin-right: 10px;
}

.header-title {
  font-size: 18px;
}

/* CHAT */

.chat {
  flex: 1;
  overflow-y: auto;
  padding: 12px;
}

.message {
  max-width: 90%;
  padding: 12px 14px;
  margin-bottom: 10px;
  border-radius: 12px;
  white-space: pre-wrap;
  line-height: 1.5;
  word-wrap: break-word;
}

.message.ai {
  background: #bdbdbd;
  color: #111;
  margin-right: auto;
}

.message.user {
  background: #4a7fe8;
  color: white;
  margin-left: auto;
}

/* BOTTOM */

.bottom {
  position: relative;

  display: flex;
  align-items: center;
  gap: 7px;

  padding: 10px;
  background: #999999;
}

/* PIN */

.pin-wrap {
  position: relative;
  flex: 0 0 auto;
}

.pin-btn {
  width: 44px;
  height: 44px;

  border: none;
  border-radius: 10px;

  background: #333333;
  color: white;

  font-size: 21px;
  cursor: pointer;
}

.pin-btn:active {
  transform: scale(0.94);
}

/* PIN MENU */

.pin-menu {
  position: absolute;

  left: 0;
  bottom: 52px;

  display: none;
  flex-direction: column;
  gap: 5px;

  min-width: 170px;

  padding: 8px;

  background: #eeeeee;
  border-radius: 12px;

  box-shadow:
    0 4px 15px
    rgba(0,0,0,0.25);

  z-index: 3000;
}

.pin-menu.show {
  display: flex;
}

.pin-menu button {
  border: none;
  border-radius: 8px;

  padding: 11px;

  background: transparent;
  color: #222;

  text-align: left;
  font-size: 15px;

  cursor: pointer;
}

.pin-menu button:active {
  background: #dddddd;
}

/* INPUT */

.input {
  flex: 1;
  min-width: 0;

  border: none;
  outline: none;

  border-radius: 10px;

  padding: 13px;

  background: #777777;
  color: white;

  font-size: 15px;
}

.input::placeholder {
  color: #eeeeee;
}

/* SEND */

.send-btn {
  height: 44px;

  border: none;
  border-radius: 10px;

  padding: 0 16px;

  background: #333333;
  color: white;

  font-weight: bold;

  cursor: pointer;
}

.send-btn:disabled {
  opacity: 0.5;
}

/* VOICE */

.voice-btn {
  width: 44px;
  height: 44px;

  flex: 0 0 44px;

  border: none;
  border-radius: 10px;

  background: #333333;
  color: white;

  font-size: 20px;

  cursor: pointer;
}

.voice-btn:active {
  transform: scale(0.94);
}

.voice-btn.listening {
  background: #b00020;
}

/* CAMERA */

.camera-screen {
  position: fixed;
  inset: 0;

  display: none;
  flex-direction: column;

  background: #000000;

  z-index: 5000;
}

.camera-screen.show {
  display: flex;
}

#cameraVideo {
  width: 100%;
  height: 100%;

  object-fit: cover;
}

.camera-controls {
  position: absolute;

  left: 0;
  right: 0;
  bottom: 0;

  display: flex;
  justify-content: center;
  align-items: center;

  gap: 25px;

  padding: 20px;
}

.camera-close-btn,
.camera-take-btn {
  border: none;
  border-radius: 50%;

  cursor: pointer;
}

.camera-close-btn {
  width: 48px;
  height: 48px;

  background: #333333;
  color: white;

  font-size: 24px;
}

.camera-take-btn {
  width: 68px;
  height: 68px;

  background: white;

  border: 5px solid #777777;
}

/* TYPING */

.typing {
  display: flex;
  gap: 5px;
  padding: 12px;
}

.dot {
  width: 7px;
  height: 7px;

  background: #555;

  border-radius: 50%;

  animation: blink 1s infinite;
}

.dot:nth-child(2) {
  animation-delay: .2s;
}

.dot:nth-child(3) {
  animation-delay: .4s;
}

@keyframes blink {

  0%,
  80%,
  100% {
    opacity: .3;
  }

  40% {
    opacity: 1;
  }

}

</style>
</head>

<body>

<div class="app">

  <!-- HEADER -->

  <div class="header">

    <button
      class="back-btn"
      id="backBtn"
      type="button"
    >
      ←
    </button>

    <div class="header-title">
      📚 MAKE NOTES WITH JR AI 🤖✨
    </div>

  </div>


  <!-- CHAT -->

  <div
    class="chat"
    id="chat"
  ></div>


  <!-- BOTTOM -->

  <div class="bottom">


    <!-- PIN -->

    <div class="pin-wrap">

      <button
        class="pin-btn"
        id="pinBtn"
        type="button"
      >
        📌
      </button>


      <!-- PIN MENU -->

      <div
        class="pin-menu"
        id="pinMenu"
      >

        <button
          type="button"
          id="fileBtn"
        >
          📎 File
        </button>

        <button
          type="button"
          id="albumBtn"
        >
          🖼️ Album
        </button>

        <button
          type="button"
          id="cameraBtn"
        >
          📷 Camera
        </button>

      </div>

    </div>


    <!-- HIDDEN FILE INPUT -->

    <input
      type="file"
      id="fileInput"
      hidden
    >

    <input
      type="file"
      id="albumInput"
      accept="image/*"
      multiple
      hidden
    >


    <!-- TEXT INPUT -->

    <input
      id="messageInput"
      class="input"
      type="text"
      placeholder="Enter or type your notes/topic..."
      autocomplete="off"
    >


    <!-- SEND -->

    <button
      id="sendBtn"
      class="send-btn"
      type="button"
    >
      NOTES
    </button>


    <!-- VOICE -->

    <button
      id="voiceBtn"
      class="voice-btn"
      type="button"
    >
      🎙️
    </button>

  </div>

</div>


<!-- CAMERA SCREEN -->

<div
  class="camera-screen"
  id="cameraScreen"
>

  <video
    id="cameraVideo"
    autoplay
    playsinline
  ></video>

  <div class="camera-controls">

    <button
      type="button"
      id="cameraCloseBtn"
      class="camera-close-btn"
    >
      ✕
    </button>

    <button
      type="button"
      id="cameraTakeBtn"
      class="camera-take-btn"
    >
    </button>

  </div>

</div>


<script>

/* =========================================
   API
========================================= */

const API_URL =
"https://script.google.com/macros/s/AKfycbwyW1sNFAI9lgYH_7_FWng44IWUUrbIadwPMRM6vrmw84C8w41rWvBkACuIAasVmAHT/exec";


/* =========================================
   ELEMENTS
========================================= */

const chat =
document.getElementById("chat");

const messageInput =
document.getElementById("messageInput");

const sendBtn =
document.getElementById("sendBtn");

const backBtn =
document.getElementById("backBtn");

const pinBtn =
document.getElementById("pinBtn");

const pinMenu =
document.getElementById("pinMenu");

const fileBtn =
document.getElementById("fileBtn");

const albumBtn =
document.getElementById("albumBtn");

const cameraBtn =
document.getElementById("cameraBtn");

const fileInput =
document.getElementById("fileInput");

const albumInput =
document.getElementById("albumInput");

const voiceBtn =
document.getElementById("voiceBtn");

const cameraScreen =
document.getElementById("cameraScreen");

const cameraVideo =
document.getElementById("cameraVideo");

const cameraCloseBtn =
document.getElementById("cameraCloseBtn");

const cameraTakeBtn =
document.getElementById("cameraTakeBtn");


/* =========================================
   VARIABLES
========================================= */

let isSending = false;

let cameraStream = null;

let recognition = null;


/* =========================================
   USER ID
========================================= */

const USER_KEY =
"jr_ai_user_id";


function getUserId() {

  let userId =
    localStorage.getItem(
      USER_KEY
    );

  if (!userId) {

    userId =
      "jr_" +
      Date.now() +
      "_" +
      Math.random()
        .toString(36)
        .slice(2);

    localStorage.setItem(
      USER_KEY,
      userId
    );

  }

  return userId;

}


/* =========================================
   SCROLL
========================================= */

function scrollToBottom() {

  requestAnimationFrame(
    function() {

      chat.scrollTop =
        chat.scrollHeight;

    }
  );

}


/* =========================================
   ADD MESSAGE
========================================= */

function addMessage(
  text,
  type
) {

  const message =
    document.createElement(
      "div"
    );

  message.className =
    "message " +
    type;

  chat.appendChild(
    message
  );


  if (
    type === "ai"
  ) {

    let i = 0;

    function typeNext() {

      if (
        i < text.length
      ) {

        message.textContent +=
          text.slice(
            i,
            i + 3
          );

        i += 3;

        scrollToBottom();

        setTimeout(
          typeNext,
          15
        );

      }

    }

    typeNext();

  } else {

    message.textContent =
      text;

    scrollToBottom();

  }

}


/* =========================================
   TYPING
========================================= */

function showTyping() {

  const typing =
    document.createElement(
      "div"
    );

  typing.className =
    "typing";

  typing.id =
    "typingIndicator";


  for (
    let i = 0;
    i < 3;
    i++
  ) {

    const dot =
      document.createElement(
        "div"
      );

    dot.className =
      "dot";

    typing.appendChild(
      dot
    );

  }


  chat.appendChild(
    typing
  );

  scrollToBottom();

}


function hideTyping() {

  const typing =
    document.getElementById(
      "typingIndicator"
    );

  if (typing) {

    typing.remove();

  }

}


/* =========================================
   CREATE NOTES
========================================= */

async function createNotes() {

  if (
    isSending
  ) {
    return;
  }


  const topic =
    messageInput.value.trim();


  if (!topic) {

    messageInput.focus();

    return;

  }


  isSending = true;

  sendBtn.disabled =
    true;

  messageInput.disabled =
    true;

  voiceBtn.disabled =
    true;


  addMessage(
    topic,
    "user"
  );


  messageInput.value = "";

  showTyping();


  const prompt =
    "Create detailed, well-organized, student-friendly notes on this topic: " +
    topic +
    ". Include clear headings, definitions, important points, explanations, examples where useful, key terms, and a concise revision summary. Cover the topic thoroughly and make the notes easy to study.";


  const controller =
    new AbortController();


  const timeout =
    setTimeout(
      function() {

        controller.abort();

      },
      60000
    );


  try {

    const response =
      await fetch(
        API_URL,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "text/plain;charset=utf-8"
          },

          body: JSON.stringify({

            message:
              prompt,

            userId:
              getUserId()

          }),

          signal:
            controller.signal

        }
      );


    if (!response.ok) {

      throw new Error(
        "Server error: " +
        response.status
      );

    }


    const data =
      await response.json();


    clearTimeout(
      timeout
    );

    hideTyping();


    if (
      data &&
      data.error
    ) {

      addMessage(
        "⚠️ " +
        data.error,
        "ai"
      );

      return;

    }


    const answer =
      data &&
      data.answer
        ? String(
            data.answer
          ).trim()
        : "";


    if (!answer) {

      addMessage(
        "⚠️ AI ne empty response diya. Please try again.",
        "ai"
      );

      return;

    }


    addMessage(
      answer,
      "ai"
    );


  } catch (error) {

    clearTimeout(
      timeout
    );

    hideTyping();


    addMessage(
      "⚠️ Kuch problem aa gayi. Please try again.",
      "ai"
    );


  } finally {

    isSending =
      false;

    sendBtn.disabled =
      false;

    messageInput.disabled =
      false;

    voiceBtn.disabled =
      false;

    messageInput.focus();

  }

}


/* =========================================
   BACK
========================================= */

backBtn.addEventListener(
  "click",
  function() {

    window.location.href =
      "index.html";

  }
);


/* =========================================
   PIN MENU
========================================= */

pinBtn.addEventListener(
  "click",
  function(event) {

    event.stopPropagation();

    pinMenu.classList.toggle(
      "show"
    );

  }
);


/* CLOSE PIN MENU OUTSIDE */

document.addEventListener(
  "click",
  function(event) {

    if (
      !event.target.closest(
        ".pin-wrap"
      )
    ) {

      pinMenu.classList.remove(
        "show"
      );

    }

  }
);


/* =========================================
   FILE
========================================= */

fileBtn.addEventListener(
  "click",
  function() {

    pinMenu.classList.remove(
      "show"
    );

    fileInput.click();

  }
);


fileInput.addEventListener(
  "change",
  function() {

    if (
      !this.files.length
    ) {
      return;
    }

    const file =
      this.files[0];

    messageInput.value =
      "📎 " +
      file.name;

    messageInput.focus();

  }
);


/* =========================================
   ALBUM
========================================= */

albumBtn.addEventListener(
  "click",
  function() {

    pinMenu.classList.remove(
      "show"
    );

    albumInput.click();

  }
);


albumInput.addEventListener(
  "change",
  function() {

    if (
      !this.files.length
    ) {
      return;
    }

    const names =
      Array.from(
        this.files
      )
      .map(
        function(file) {
          return file.name;
        }
      )
      .join(", ");

    messageInput.value =
      "🖼️ " +
      names;

    messageInput.focus();

  }
);


/* =========================================
   CAMERA
========================================= */

async function openCamera() {

  pinMenu.classList.remove(
    "show"
  );


  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {

    alert(
      "Camera is not supported on this device/browser."
    );

    return;

  }


  try {

    cameraStream =
      await navigator.mediaDevices.getUserMedia(
        {
          video: true,
          audio: false
        }
      );


    cameraVideo.srcObject =
      cameraStream;

    cameraScreen.classList.add(
      "show"
    );


  } catch (error) {

    alert(
      "Camera permission allow karo."
    );

  }

}


function closeCamera() {

  if (
    cameraStream
  ) {

    cameraStream
      .getTracks()
      .forEach(
        function(track) {

          track.stop();

        }
      );

    cameraStream =
      null;

  }


  cameraVideo.srcObject =
    null;

  cameraScreen.classList.remove(
    "show"
  );

}


cameraBtn.addEventListener(
  "click",
  openCamera
);


cameraCloseBtn.addEventListener(
  "click",
  closeCamera
);


/* TAKE PHOTO */

cameraTakeBtn.addEventListener(
  "click",
  function() {

    if (
      !cameraVideo.videoWidth
    ) {
      return;
    }


    const canvas =
      document.createElement(
        "canvas"
      );

    canvas.width =
      cameraVideo.videoWidth;

    canvas.height =
      cameraVideo.videoHeight;


    const context =
      canvas.getContext(
        "2d"
      );


    context.drawImage(
      cameraVideo,
      0,
      0,
      canvas.width,
      canvas.height
    );


    closeCamera();


    messageInput.value =
      "📷 Camera photo captured";

    messageInput.focus();

  }
);


/* =========================================
   VOICE
========================================= */

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

if (SpeechRecognition) {

  recognition =
    new SpeechRecognition();

  recognition.lang = "hi-IN";
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  recognition.onstart = function() {

    voiceBtn.classList.add("listening");
    voiceBtn.textContent = "🔴";

  };

  recognition.onresult = function(event) {

    const transcript =
      event.results[0][0].transcript;

    messageInput.value =
      transcript;

    messageInput.focus();

  };

  recognition.onerror = function(event) {

    console.log(
      "Voice error:",
      event.error
    );

    voiceBtn.classList.remove(
      "listening"
    );

    voiceBtn.textContent = "🎙️";

    if (
      event.error === "not-allowed"
    ) {

      alert(
        "Microphone permission Allow karo."
      );

    }

  };

  recognition.onend = function() {

    voiceBtn.classList.remove(
      "listening"
    );

    voiceBtn.textContent = "🎙️";

  };

  voiceBtn.addEventListener(
    "click",
    function() {

      if (isSending) {
        return;
      }

      try {

        recognition.start();

      } catch (error) {

        console.log(
          "Voice start error:",
          error
        );

      }

    }
  );

} else {

  voiceBtn.addEventListener(
    "click",
    function() {

      alert(
        "Is browser mein voice input supported nahi hai. Chrome browser use karo."
      );

    }
  );

  }

/* =========================================
   SEND
========================================= */

sendBtn.addEventListener(
  "click",
  function() {

    createNotes();

  }
);


/* =========================================
   ENTER KEY
========================================= */

messageInput.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "Enter"
    ) {

      event.preventDefault();

      createNotes();

    }

  }
);


/* =========================================
   FIRST MESSAGE
========================================= */

addMessage(
  "📚 Enter any topic and I'll create detailed study notes for you. 🤖✨",
  "ai"
);
  
/* =========================================
   GLOBAL THEME
========================================= */

function applyGlobalTheme() {

  const savedTheme =
    localStorage.getItem("jr_ai_theme") || "light";

  if (savedTheme === "dark") {
    document.body.classList.add("dark");
  } else {
    document.body.classList.remove("dark");
  }

}

applyGlobalTheme();
  
</script>

</body>
</html>
