<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#080a16">
<title>JR AI — Smart Notes</title>

<style>
*{box-sizing:border-box}

:root{
  --bg:#080a16;
  --panel:rgba(18,22,43,.82);
  --panel2:rgba(25,30,56,.76);
  --line:rgba(255,255,255,.10);
  --text:#f7f8ff;
  --muted:#a9aec7;
  --blue:#5b8cff;
  --purple:#9b6cff;
  --cyan:#54d8ff;
  --danger:#ff5578;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

body:before,
body:after{
  content:"";
  position:fixed;
  width:300px;
  height:300px;
  border-radius:50%;
  filter:blur(85px);
  opacity:.30;
  pointer-events:none;
  z-index:0;
}

body:before{
  background:#4c55ff;
  left:-120px;
  top:-100px;
}

body:after{
  background:#a044ff;
  right:-130px;
  bottom:-110px;
}

.app{
  position:relative;
  z-index:1;
  height:100dvh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* HEADER */

.header{
  height:64px;
  min-height:64px;
  display:flex;
  align-items:center;
  gap:11px;
  padding:0 12px;

  background:rgba(8,10,22,.82);
  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);

  border-bottom:1px solid var(--line);
  box-shadow:0 8px 30px rgba(0,0,0,.20);
}

.back-btn{
  width:42px;
  height:42px;

  border:1px solid var(--line);
  border-radius:13px;

  background:rgba(255,255,255,.07);
  color:white;

  font-size:23px;
  cursor:pointer;

  display:grid;
  place-items:center;

  transition:.2s;
}

.back-btn:active{
  transform:scale(.93);
}

.brand{
  min-width:0;
  flex:1;
}

.brand-title{
  font-size:16px;
  font-weight:800;
  letter-spacing:.2px;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.brand-sub{
  margin-top:2px;
  color:var(--muted);
  font-size:11px;
}

.status-pill{
  display:flex;
  align-items:center;
  gap:6px;

  padding:7px 9px;

  border:1px solid rgba(84,216,255,.20);
  background:rgba(84,216,255,.07);

  border-radius:999px;

  color:#a9edff;
  font-size:10px;
  font-weight:800;
}

.status-dot{
  width:7px;
  height:7px;
  border-radius:50%;

  background:#4cffaa;
  box-shadow:0 0 12px #4cffaa;
}

/* CHAT */

.chat{
  flex:1;
  min-height:0;

  overflow-y:auto;
  overflow-x:hidden;

  padding:14px 13px 18px;

  scroll-behavior:smooth;
  overscroll-behavior:contain;
}

/* HERO */

.hero{
  padding:17px;
  margin-bottom:12px;

  border:1px solid var(--line);
  border-radius:22px;

  background:
    linear-gradient(
      145deg,
      rgba(91,140,255,.15),
      rgba(155,108,255,.11)
    );

  box-shadow:
    0 18px 55px rgba(0,0,0,.25);
}

.hero-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.hero-icon{
  width:48px;
  height:48px;

  border-radius:16px;

  display:grid;
  place-items:center;

  font-size:25px;

  background:
    linear-gradient(
      135deg,
      #5b8cff,
      #9b6cff
    );

  box-shadow:
    0 10px 28px rgba(91,140,255,.28);
}

.xp{
  color:#d8d9ff;
  font-size:11px;
  font-weight:800;
}

.hero h1{
  margin:12px 0 5px;
  font-size:22px;
  line-height:1.15;
}

.hero p{
  margin:0;
  color:var(--muted);
  font-size:12px;
  line-height:1.55;
}

/* QUICK */

.quick-title{
  margin:14px 3px 8px;

  color:#c9cce0;

  font-size:11px;
  font-weight:800;

  letter-spacing:.7px;
  text-transform:uppercase;
}

.quick-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:8px;

  margin-bottom:13px;
}

.quick{
  border:1px solid var(--line);

  background:rgba(255,255,255,.055);
  color:#f6f7ff;

  border-radius:15px;

  padding:12px;

  text-align:left;
  cursor:pointer;

  transition:.2s;
}

.quick:active{
  transform:scale(.97);
}

.quick b{
  display:block;
  font-size:12px;
}

.quick span{
  display:block;
  margin-top:3px;

  color:var(--muted);
  font-size:10px;
}

/* MESSAGE */

.message{
  max-width:92%;

  padding:12px 14px;
  margin:0 0 10px;

  border-radius:17px;

  white-space:pre-wrap;
  line-height:1.55;

  word-wrap:break-word;

  border:1px solid var(--line);

  font-size:14px;

  box-shadow:
    0 8px 25px rgba(0,0,0,.12);
}

.message.ai{
  background:
    linear-gradient(
      145deg,
      rgba(25,30,56,.90),
      rgba(18,22,43,.90)
    );

  color:#f1f3ff;
  margin-right:auto;
}

.message.user{
  background:
    linear-gradient(
      135deg,
      #4d7fff,
      #7958e8
    );

  color:white;
  margin-left:auto;

  border-color:
    rgba(255,255,255,.15);
}

/* TYPING */

.typing{
  display:flex;
  align-items:center;
  gap:5px;

  width:max-content;

  padding:12px 14px;
  margin-bottom:10px;

  border:1px solid var(--line);
  border-radius:16px;

  background:rgba(25,30,56,.82);
}

.dot{
  width:7px;
  height:7px;

  background:#9fa8d2;

  border-radius:50%;

  animation:blink 1s infinite;
}

.dot:nth-child(2){
  animation-delay:.2s;
}

.dot:nth-child(3){
  animation-delay:.4s;
}

@keyframes blink{
  0%,80%,100%{
    opacity:.25;
    transform:translateY(0);
  }

  40%{
    opacity:1;
    transform:translateY(-3px);
  }
}

/* BOTTOM */

.bottom{
  position:relative;

  display:flex;
  align-items:center;

  gap:7px;

  padding:
    9px
    10px
    calc(9px + env(safe-area-inset-bottom));

  background:rgba(8,10,22,.90);

  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);

  border-top:1px solid var(--line);

  box-shadow:
    0 -12px 35px rgba(0,0,0,.22);
}

/* ATTACH */

.pin-wrap{
  position:relative;
  flex:0 0 auto;
}

.pin-btn,
.voice-btn{
  width:45px;
  height:45px;

  flex:0 0 45px;

  border:1px solid var(--line);
  border-radius:14px;

  background:rgba(255,255,255,.075);
  color:white;

  font-size:20px;

  cursor:pointer;

  transition:.2s;
}

.pin-btn:active,
.voice-btn:active{
  transform:scale(.93);
}

/* PIN MENU */

.pin-menu{
  position:absolute;

  left:0;
  bottom:54px;

  display:none;
  flex-direction:column;

  gap:5px;

  min-width:195px;

  padding:8px;

  background:rgba(20,24,44,.98);

  border:1px solid var(--line);
  border-radius:16px;

  box-shadow:
    0 20px 45px rgba(0,0,0,.45);

  z-index:3000;

  backdrop-filter:blur(20px);
}

.pin-menu.show{
  display:flex;
}

.pin-menu button{
  border:1px solid transparent;
  border-radius:11px;

  padding:12px;

  background:transparent;
  color:white;

  text-align:left;
  font-size:13px;

  cursor:pointer;
}

.pin-menu button:hover{
  background:rgba(255,255,255,.07);
}

.pin-menu button:active{
  background:rgba(91,140,255,.15);
}

/* INPUT */

.input{
  flex:1;
  min-width:0;

  height:45px;

  border:1px solid var(--line);
  outline:none;

  border-radius:14px;

  padding:0 13px;

  background:rgba(255,255,255,.065);

  color:white;

  font-size:14px;
}

.input:focus{
  border-color:
    rgba(91,140,255,.65);

  box-shadow:
    0 0 0 3px
    rgba(91,140,255,.10);
}

.input::placeholder{
  color:#8f95b0;
}

/* NOTES */

.send-btn{
  height:45px;

  border:0;
  border-radius:14px;

  padding:0 15px;

  background:
    linear-gradient(
      135deg,
      #5b8cff,
      #8b5cf6
    );

  color:white;

  font-weight:900;
  font-size:12px;

  cursor:pointer;

  box-shadow:
    0 8px 22px
    rgba(91,140,255,.25);

  transition:.2s;
}

.send-btn:active{
  transform:scale(.95);
}

.send-btn:disabled{
  opacity:.5;
}

/* VOICE */

.voice-btn.listening{
  background:
    linear-gradient(
      135deg,
      #ff315c,
      #b00036
    );

  border-color:
    rgba(255,100,130,.35);

  animation:pulse 1s infinite;
}

@keyframes pulse{
  50%{
    box-shadow:
      0 0 0 7px
      rgba(255,49,92,.08);
  }
}

/* CAMERA */

.camera-screen{
  position:fixed;
  inset:0;

  display:none;
  flex-direction:column;

  background:#000;

  z-index:5000;
}

.camera-screen.show{
  display:flex;
}

#cameraVideo{
  width:100%;
  height:100%;
  object-fit:cover;
}

.camera-top{
  position:absolute;

  top:0;
  left:0;
  right:0;

  padding:16px;

  z-index:2;
}

.camera-label{
  width:max-content;

  padding:8px 11px;

  border-radius:999px;

  background:rgba(0,0,0,.45);

  color:white;

  font-size:11px;

  border:1px solid
    rgba(255,255,255,.14);

  backdrop-filter:blur(12px);
}

.camera-controls{
  position:absolute;

  left:0;
  right:0;
  bottom:0;

  display:flex;

  justify-content:center;
  align-items:center;

  gap:25px;

  padding:
    20px
    20px
    calc(20px + env(safe-area-inset-bottom));

  background:
    linear-gradient(
      transparent,
      rgba(0,0,0,.75)
    );
}

.camera-close-btn{
  width:48px;
  height:48px;

  border-radius:50%;

  background:rgba(255,255,255,.13);

  color:white;

  font-size:22px;

  border:1px solid
    rgba(255,255,255,.18);

  cursor:pointer;
}

.camera-take-btn{
  width:70px;
  height:70px;

  border-radius:50%;

  background:white;

  border:6px solid
    rgba(255,255,255,.35);

  cursor:pointer;

  box-shadow:
    0 0 0 2px
    rgba(0,0,0,.35);
}

/* DESKTOP */

@media(min-width:700px){

  .chat{
    padding-left:
      max(13px,calc((100vw - 760px)/2));

    padding-right:
      max(13px,calc((100vw - 760px)/2));
  }

  .message{
    max-width:760px;
  }

  .hero,
  .quick-title,
  .quick-grid{
    max-width:760px;

    margin-left:auto;
    margin-right:auto;
  }

  .bottom{
    padding-left:
      max(10px,calc((100vw - 760px)/2));

    padding-right:
      max(10px,calc((100vw - 760px)/2));
  }
}

body.dark{
  background:var(--bg);
}
</style>
</head>

<body>

<div class="app">

  <!-- HEADER -->

  <header class="header">

    <button
      class="back-btn"
      id="backBtn"
      type="button"
    >
      ←
    </button>

    <div class="brand">

      <div class="brand-title">
        📚 Smart Notes with JR AI
      </div>

      <div class="brand-sub">
        Turn boring topics into study-ready notes.
      </div>

    </div>

    <div class="status-pill">
      <span class="status-dot"></span>
      JR READY
    </div>

  </header>


  <!-- CHAT -->

  <main
    class="chat"
    id="chat"
  >

    <section class="hero">

      <div class="hero-top">

        <div class="hero-icon">
          🧠
        </div>

        <div
          class="xp"
          id="xpLabel"
        >
          ⚡ Level 1 · 0 XP
        </div>

      </div>

      <h1>
        Let's make notes. Not excuses. 😭
      </h1>

      <p>
        Topic bhejo, JR AI usko clean,
        detailed aur student-friendly notes
        mein convert karega.
      </p>

    </section>


    <div class="quick-title">
      ⚡ QUICK START
    </div>


    <div class="quick-grid">

      <button
        class="quick"
        type="button"
        data-prompt="Explain this topic in very simple student-friendly language: "
      >
        <b>🧠 Explain Simply</b>
        <span>Hard topic → easy language</span>
      </button>

      <button
        class="quick"
        type="button"
        data-prompt="Create concise revision notes with only the most important points for: "
      >
        <b>📌 Key Points</b>
        <span>Fast revision mode</span>
      </button>

      <button
        class="quick"
        type="button"
        data-prompt="Generate important exam-style questions with answers from this topic: "
      >
        <b>❓ Questions</b>
        <span>Practice before exam</span>
      </button>

      <button
        class="quick"
        type="button"
        data-prompt="Create a short quiz to test my understanding of: "
      >
        <b>🎯 Mini Quiz</b>
        <span>Let's see what you remember</span>
      </button>

      <button
        class="quick"
        type="button"
        data-prompt="Turn this topic into concise flashcard-style revision points: "
      >
        <b>🃏 Flashcards</b>
        <span>Memory mode ON</span>
      </button>

      <button
        class="quick"
        type="button"
        data-prompt="Improve and organize these notes into clean headings, subheadings and bullet points: "
      >
        <b>✨ Improve Notes</b>
        <span>Messy → premium notes</span>
      </button>

    </div>

  </main>


  <!-- BOTTOM -->

  <div class="bottom">

    <div class="pin-wrap">

      <button
        class="pin-btn"
        id="pinBtn"
        type="button"
        aria-label="Attach"
      >
        📎
      </button>


      <div
        class="pin-menu"
        id="pinMenu"
      >

        <button
          type="button"
          id="fileBtn"
        >
          📄 &nbsp;Choose File
        </button>

        <button
          type="button"
          id="albumBtn"
        >
          🖼️ &nbsp;Choose Images
        </button>

        <button
          type="button"
          id="cameraBtn"
        >
          📷 &nbsp;Open Camera
        </button>

      </div>

    </div>


    <input
      type="file"
      id="fileInput"
      hidden
    >

    <input
      type="file"
      id="albumInput"
      accept="image/*"
      multiple
      hidden
    >


    <input
      id="messageInput"
      class="input"
      type="text"
      placeholder="Topic likho… e.g. Photosynthesis"
      autocomplete="off"
    >


    <button
      id="sendBtn"
      class="send-btn"
      type="button"
    >
      ✨ NOTES
    </button>


    <button
      id="voiceBtn"
      class="voice-btn"
      type="button"
      aria-label="Voice input"
    >
      🎙️
    </button>

  </div>

</div>


<!-- CAMERA -->

<div
  class="camera-screen"
  id="cameraScreen"
>

  <div class="camera-top">

    <div class="camera-label">
      📷 JR AI Camera
    </div>

  </div>

  <video
    id="cameraVideo"
    autoplay
    playsinline
  ></video>

  <div class="camera-controls">

    <button
      type="button"
      id="cameraCloseBtn"
      class="camera-close-btn"
    >
      ✕
    </button>

    <button
      type="button"
      id="cameraTakeBtn"
      class="camera-take-btn"
    ></button>

  </div>

</div>


<script>
/* =========================================
   JR AI SMART NOTES
   API + FILE / ALBUM / CAMERA FIXED
========================================= */

const API_URL =
"https://script.google.com/macros/s/AKfycbwyW1sNFAI9lgYH_7_FWng44IWUUrbIadwPMRM6vr84C8w41rWvBkACuIAasVmAHT/exec";

const chat = document.getElementById("chat");
const messageInput = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");
const backBtn = document.getElementById("backBtn");
const pinBtn = document.getElementById("pinBtn");
const pinMenu = document.getElementById("pinMenu");
const fileBtn = document.getElementById("fileBtn");
const albumBtn = document.getElementById("albumBtn");
const cameraBtn = document.getElementById("cameraBtn");
const fileInput = document.getElementById("fileInput");
const albumInput = document.getElementById("albumInput");
const voiceBtn = document.getElementById("voiceBtn");
const cameraScreen = document.getElementById("cameraScreen");
const cameraVideo = document.getElementById("cameraVideo");
const cameraCloseBtn = document.getElementById("cameraCloseBtn");
const cameraTakeBtn = document.getElementById("cameraTakeBtn");
const xpLabel = document.getElementById("xpLabel");

let isSending = false;
let cameraStream = null;
let recognition = null;
let selectedQuickPrompt = "";

/* USER ID */
const USER_KEY = "jr_ai_user_id";
function getUserId(){
  let userId = localStorage.getItem(USER_KEY);
  if(!userId){
    userId = "jr_" + Date.now() + "_" +
      Math.random().toString(36).slice(2);
    localStorage.setItem(USER_KEY, userId);
  }
  return userId;
}

/* XP */
const XP_KEY = "jr_ai_notes_xp";
function updateProgress(){
  const xp = Number(localStorage.getItem(XP_KEY) || 0);
  const level = Math.floor(xp / 100) + 1;
  xpLabel.textContent = "⚡ Level " + level + " · " + xp + " XP";
}
function addXP(amount){
  let xp = Number(localStorage.getItem(XP_KEY) || 0);
  xp += amount;
  localStorage.setItem(XP_KEY, String(xp));
  updateProgress();
}
updateProgress();

/* SCROLL */
function scrollToBottom(){
  requestAnimationFrame(() => {
    chat.scrollTop = chat.scrollHeight;
  });
}

/* MESSAGE */
function addMessage(text, type){
  const message = document.createElement("div");
  message.className = "message " + type;
  chat.appendChild(message);

  if(type === "ai"){
    let i = 0;
    function typeNext(){
      if(i < text.length){
        message.textContent += text.slice(i, i + 3);
        i += 3;
        scrollToBottom();
        setTimeout(typeNext, 15);
      }
    }
    typeNext();
  }else{
    message.textContent = text;
    scrollToBottom();
  }
}

/* TYPING */
function showTyping(){
  hideTyping();
  const typing = document.createElement("div");
  typing.className = "typing";
  typing.id = "typingIndicator";
  for(let i=0;i<3;i++){
    const dot = document.createElement("div");
    dot.className = "dot";
    typing.appendChild(dot);
  }
  chat.appendChild(typing);
  scrollToBottom();
}
function hideTyping(){
  const typing = document.getElementById("typingIndicator");
  if(typing) typing.remove();
}

/* NOTES */
async function createNotes(){
  if(isSending) return;

  const topic = messageInput.value.trim();
  if(!topic){
    messageInput.focus();
    return;
  }

  isSending = true;
  sendBtn.disabled = true;
  messageInput.disabled = true;
  voiceBtn.disabled = true;

  addMessage(topic, "user");
  messageInput.value = "";
  showTyping();

  const prompt = selectedQuickPrompt
    ? selectedQuickPrompt + topic
    : "Create detailed, well-organized, student-friendly notes on this topic: " +
      topic +
      ". Include clear headings, definitions, important points, explanations, examples where useful, key terms, and a concise revision summary. Cover the topic thoroughly and make the notes easy to study.";

  selectedQuickPrompt = "";

  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 60000);

  try{
    const response = await fetch(API_URL,{
      method:"POST",
      headers:{
        "Content-Type":"text/plain;charset=utf-8"
      },
      body:JSON.stringify({
        message:prompt,
        userId:getUserId()
      }),
      signal:controller.signal
    });

    if(!response.ok){
      throw new Error("Server error: " + response.status);
    }

    const data = await response.json();
    clearTimeout(timeout);
    hideTyping();

    if(data && data.error){
      addMessage("⚠️ " + data.error,"ai");
      return;
    }

    const answer = data && data.answer
      ? String(data.answer).trim()
      : "";

    if(!answer){
      addMessage("⚠️ AI ne empty response diya. Please try again.","ai");
      return;
    }

    addMessage(answer,"ai");
    addXP(10);
    saveCurrentChat();

  }catch(error){
    clearTimeout(timeout);
    hideTyping();

    let errorText = "⚠️ Kuch problem aa gayi. Please try again.";
    if(error && error.name === "AbortError"){
      errorText = "⚠️ Server response me zyada time lag raha hai. Please try again.";
    }else if(error && error.message){
      errorText = "⚠️ " + error.message;
    }
    addMessage(errorText,"ai");
  }finally{
    isSending = false;
    sendBtn.disabled = false;
    messageInput.disabled = false;
    voiceBtn.disabled = false;
    messageInput.focus({preventScroll:true});
    scrollToBottom();
  }
}

/* BASIC CHAT SAVE - safe even if other pages are absent */
function saveCurrentChat(){
  try{
    const messages = [...chat.querySelectorAll(".message")]
      .map(el => ({
        type: el.classList.contains("user") ? "user" : "ai",
        text: el.textContent.trim()
      }))
      .filter(x => x.text);

    localStorage.setItem("jr_ai_notes_last_chat", JSON.stringify(messages));
  }catch(e){}
}

/* BACK */
backBtn.addEventListener("click", () => {
  if(isSending) return;
  if(history.length > 1) history.back();
  else window.location.href = "index.html";
});

/* QUICK START */
document.querySelectorAll(".quick").forEach(btn => {
  btn.addEventListener("click", () => {
    selectedQuickPrompt = btn.dataset.prompt || "";
    messageInput.focus();
    messageInput.scrollIntoView({behavior:"smooth",block:"center"});
  });
});

/* SEND */
sendBtn.addEventListener("click", createNotes);

messageInput.addEventListener("keydown", event => {
  if(event.key === "Enter" && !event.shiftKey){
    event.preventDefault();
    createNotes();
  }
});

/* ATTACHMENT MENU */
pinBtn.addEventListener("click", event => {
  event.stopPropagation();
  pinMenu.classList.toggle("show");
});

document.addEventListener("click", event => {
  if(!event.target.closest(".pin-wrap")){
    pinMenu.classList.remove("show");
  }
});

/*
  IMPORTANT:
  Do not use display:none for the actual input on some Android WebViews.
  opacity/positioning keeps it clickable by the browser while it remains invisible.
*/
[fileInput, albumInput].forEach(input => {
  input.style.position = "fixed";
  input.style.left = "-9999px";
  input.style.width = "1px";
  input.style.height = "1px";
  input.style.opacity = "0";
  input.style.pointerEvents = "none";
});

/* FILE PICKER */
fileBtn.addEventListener("click", () => {
  pinMenu.classList.remove("show");
  setTimeout(() => fileInput.click(), 50);
});

/* ALBUM / GALLERY */
albumBtn.addEventListener("click", () => {
  pinMenu.classList.remove("show");
  setTimeout(() => albumInput.click(), 50);
});

/* FILE SELECTED */
fileInput.addEventListener("change", () => {
  const files = [...fileInput.files];
  if(files.length){
    showSelectedFiles(files);
  }
  fileInput.value = "";
});

/* IMAGES SELECTED */
albumInput.addEventListener("change", () => {
  const files = [...albumInput.files];
  if(files.length){
    showSelectedFiles(files);
  }
  albumInput.value = "";
});

function showSelectedFiles(files){
  const names = files.map(f => f.name).join(", ");
  addMessage(
    "📎 Selected: " + names,
    "user"
  );

  // Put the selected filename(s) into the input as context.
  // The files themselves are not uploaded to Gemini by this page.
  messageInput.value =
    "Use these selected file(s) as reference: " + names;
  messageInput.focus();
}

/* CAMERA */
cameraBtn.addEventListener("click", async () => {
  pinMenu.classList.remove("show");

  /*
    getUserMedia needs a secure context. GitHub Pages/HTTPS works.
    If the Android WebView blocks it, use the native file picker camera
    fallback below.
  */
  try{
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      throw new Error("Camera API unavailable");
    }

    cameraStream = await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:"environment"}},
      audio:false
    });

    cameraVideo.srcObject = cameraStream;
    cameraScreen.classList.add("show");
  }catch(error){
    // Reliable Android WebView fallback: open camera through file chooser.
    const cameraInput = document.createElement("input");
    cameraInput.type = "file";
    cameraInput.accept = "image/*";
    cameraInput.setAttribute("capture","environment");
    cameraInput.style.position = "fixed";
    cameraInput.style.left = "-9999px";
    document.body.appendChild(cameraInput);

    cameraInput.addEventListener("change", () => {
      const files = [...cameraInput.files];
      if(files.length) showSelectedFiles(files);
      cameraInput.remove();
    }, {once:true});

    cameraInput.click();
  }
});

cameraCloseBtn.addEventListener("click", closeCamera);

function closeCamera(){
  if(cameraStream){
    cameraStream.getTracks().forEach(track => track.stop());
    cameraStream = null;
  }
  cameraVideo.srcObject = null;
  cameraScreen.classList.remove("show");
}

cameraTakeBtn.addEventListener("click", () => {
  if(!cameraStream) return;

  const canvas = document.createElement("canvas");
  canvas.width = cameraVideo.videoWidth || 1280;
  canvas.height = cameraVideo.videoHeight || 720;

  const ctx = canvas.getContext("2d");
  ctx.drawImage(cameraVideo,0,0,canvas.width,canvas.height);

  canvas.toBlob(blob => {
    if(!blob) return;

    const file = new File(
      [blob],
      "JR-AI-camera-" + Date.now() + ".jpg",
      {type:"image/jpeg"}
    );

    closeCamera();
    showSelectedFiles([file]);
  },"image/jpeg",0.92);
});

/* VOICE */
voiceBtn.addEventListener("click", () => {
  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if(!SpeechRecognition){
    alert("Voice input is not supported on this device/browser.");
    return;
  }

  if(recognition){
    recognition.stop();
    recognition = null;
    voiceBtn.classList.remove("listening");
    return;
  }

  recognition = new SpeechRecognition();
  recognition.lang = "en-IN";
  recognition.interimResults = false;
  recognition.continuous = false;

  recognition.onstart = () => {
    voiceBtn.classList.add("listening");
  };

  recognition.onresult = event => {
    const text = event.results[0][0].transcript || "";
    messageInput.value = text;
    messageInput.focus();
  };

  recognition.onerror = () => {
    voiceBtn.classList.remove("listening");
    recognition = null;
  };

  recognition.onend = () => {
    voiceBtn.classList.remove("listening");
    recognition = null;
  };

  recognition.start();
});

/* RESTORE LAST NOTES CHAT */
function restoreLastChat(){
  try{
    const saved = JSON.parse(
      localStorage.getItem("jr_ai_notes_last_chat") || "[]"
    );

    if(Array.isArray(saved) && saved.length){
      saved.forEach(item => {
        if(item && item.text) addMessage(item.text,item.type || "ai");
      });
    }
  }catch(e){}
}

/* Leave welcome screen clean on first open */
restoreLastChat();

window.addEventListener("beforeunload", closeCamera);
</script>
