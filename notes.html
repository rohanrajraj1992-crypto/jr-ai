<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#080a16">
<title>JR AI — Smart Notes</title>

<style>
*{box-sizing:border-box}

:root{
  --bg:#080a16;
  --panel:rgba(18,22,43,.82);
  --panel2:rgba(25,30,56,.76);
  --line:rgba(255,255,255,.10);
  --text:#f7f8ff;
  --muted:#a9aec7;
  --blue:#5b8cff;
  --purple:#9b6cff;
  --cyan:#54d8ff;
  --danger:#ff5578;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

body:before,
body:after{
  content:"";
  position:fixed;
  width:300px;
  height:300px;
  border-radius:50%;
  filter:blur(85px);
  opacity:.30;
  pointer-events:none;
  z-index:0;
}

body:before{
  background:#4c55ff;
  left:-120px;
  top:-100px;
}

body:after{
  background:#a044ff;
  right:-130px;
  bottom:-110px;
}

.app{
  position:relative;
  z-index:1;
  height:100dvh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* HEADER */

.header{
  height:64px;
  min-height:64px;
  display:flex;
  align-items:center;
  gap:11px;
  padding:0 12px;

  background:rgba(8,10,22,.82);
  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);

  border-bottom:1px solid var(--line);
  box-shadow:0 8px 30px rgba(0,0,0,.20);
}

.back-btn{
  width:42px;
  height:42px;

  border:1px solid var(--line);
  border-radius:13px;

  background:rgba(255,255,255,.07);
  color:white;

  font-size:23px;
  cursor:pointer;

  display:grid;
  place-items:center;

  transition:.2s;
}

.back-btn:active{
  transform:scale(.93);
}

.brand{
  min-width:0;
  flex:1;
}

.brand-title{
  font-size:16px;
  font-weight:800;
  letter-spacing:.2px;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.brand-sub{
  margin-top:2px;
  color:var(--muted);
  font-size:11px;
}

.status-pill{
  display:flex;
  align-items:center;
  gap:6px;

  padding:7px 9px;

  border:1px solid rgba(84,216,255,.20);
  background:rgba(84,216,255,.07);

  border-radius:999px;

  color:#a9edff;
  font-size:10px;
  font-weight:800;
}

.status-dot{
  width:7px;
  height:7px;
  border-radius:50%;

  background:#4cffaa;
  box-shadow:0 0 12px #4cffaa;
}

/* CHAT */

.chat{
  flex:1;
  min-height:0;

  overflow-y:auto;
  overflow-x:hidden;

  padding:14px 13px 18px;

  scroll-behavior:smooth;
  overscroll-behavior:contain;
}

/* HERO */

.hero{
  padding:17px;
  margin-bottom:12px;

  border:1px solid var(--line);
  border-radius:22px;

  background:
    linear-gradient(
      145deg,
      rgba(91,140,255,.15),
      rgba(155,108,255,.11)
    );

  box-shadow:
    0 18px 55px rgba(0,0,0,.25);
}

.hero-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.hero-icon{
  width:48px;
  height:48px;

  border-radius:16px;

  display:grid;
  place-items:center;

  font-size:25px;

  background:
    linear-gradient(
      135deg,
      #5b8cff,
      #9b6cff
    );

  box-shadow:
    0 10px 28px rgba(91,140,255,.28);
}

.xp{
  color:#d8d9ff;
  font-size:11px;
  font-weight:800;
}

.hero h1{
  margin:12px 0 5px;
  font-size:22px;
  line-height:1.15;
}

.hero p{
  margin:0;
  color:var(--muted);
  font-size:12px;
  line-height:1.55;
}

/* QUICK */

.quick-title{
  margin:14px 3px 8px;

  color:#c9cce0;

  font-size:11px;
  font-weight:800;

  letter-spacing:.7px;
  text-transform:uppercase;
}

.quick-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:8px;

  margin-bottom:13px;
}

.quick{
  border:1px solid var(--line);

  background:rgba(255,255,255,.055);
  color:#f6f7ff;

  border-radius:15px;

  padding:12px;

  text-align:left;
  cursor:pointer;

  transition:.2s;
}

.quick:active{
  transform:scale(.97);
}

.quick.selected{
  border-color:rgba(91,140,255,.9);
  background:linear-gradient(135deg,rgba(91,140,255,.20),rgba(155,108,255,.18));
  box-shadow:0 0 0 1px rgba(91,140,255,.15),0 8px 22px rgba(91,80,255,.12);
}

.quick b{
  display:block;
  font-size:12px;
}

.quick span{
  display:block;
  margin-top:3px;

  color:var(--muted);
  font-size:10px;
}

/* MESSAGE */

.message{
  max-width:92%;

  padding:12px 14px;
  margin:0 0 10px;

  border-radius:17px;

  white-space:pre-wrap;
  line-height:1.55;

  word-wrap:break-word;

  border:1px solid var(--line);

  font-size:14px;

  box-shadow:
    0 8px 25px rgba(0,0,0,.12);
}

.message.ai{
  background:
    linear-gradient(
      145deg,
      rgba(25,30,56,.90),
      rgba(18,22,43,.90)
    );

  color:#f1f3ff;
  margin-right:auto;
}

.message.user{
  background:
    linear-gradient(
      135deg,
      #4d7fff,
      #7958e8
    );

  color:white;
  margin-left:auto;

  border-color:
    rgba(255,255,255,.15);
}

/* TYPING */

.typing{
  display:flex;
  align-items:center;
  gap:5px;

  width:max-content;

  padding:12px 14px;
  margin-bottom:10px;

  border:1px solid var(--line);
  border-radius:16px;

  background:rgba(25,30,56,.82);
}

.dot{
  width:7px;
  height:7px;

  background:#9fa8d2;

  border-radius:50%;

  animation:blink 1s infinite;
}

.dot:nth-child(2){
  animation-delay:.2s;
}

.dot:nth-child(3){
  animation-delay:.4s;
}

@keyframes blink{
  0%,80%,100%{
    opacity:.25;
    transform:translateY(0);
  }

  40%{
    opacity:1;
    transform:translateY(-3px);
  }
}

/* BOTTOM */

.bottom{
  position:relative;

  display:flex;
  align-items:center;

  gap:7px;

  padding:
    9px
    10px
    calc(9px + env(safe-area-inset-bottom));

  background:rgba(8,10,22,.90);

  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);

  border-top:1px solid var(--line);

  box-shadow:
    0 -12px 35px rgba(0,0,0,.22);
}

/* ATTACH */

.pin-wrap{
  position:relative;
  flex:0 0 auto;
}

.pin-btn,
.voice-btn{
  width:45px;
  height:45px;

  flex:0 0 45px;

  border:1px solid var(--line);
  border-radius:14px;

  background:rgba(255,255,255,.075);
  color:white;

  font-size:20px;

  cursor:pointer;

  transition:.2s;
}

.pin-btn:active,
.voice-btn:active{
  transform:scale(.93);
}

/* PIN MENU */

.pin-menu{
  position:absolute;

  left:0;
  bottom:54px;

  display:none;
  flex-direction:column;

  gap:5px;

  min-width:195px;

  padding:8px;

  background:rgba(20,24,44,.98);

  border:1px solid var(--line);
  border-radius:16px;

  box-shadow:
    0 20px 45px rgba(0,0,0,.45);

  z-index:3000;

  backdrop-filter:blur(20px);
}

.pin-menu.show{
  display:flex;
}

.pin-menu button{
  border:1px solid transparent;
  border-radius:11px;

  padding:12px;

  background:transparent;
  color:white;

  text-align:left;
  font-size:13px;

  cursor:pointer;
}

.pin-menu button:hover{
  background:rgba(255,255,255,.07);
}

.pin-menu button:active{
  background:rgba(91,140,255,.15);
}

/* INPUT */

.input{
  flex:1;
  min-width:0;

  height:45px;

  border:1px solid var(--line);
  outline:none;

  border-radius:14px;

  padding:0 13px;

  background:rgba(255,255,255,.065);

  color:white;

  font-size:14px;
}

.input:focus{
  border-color:
    rgba(91,140,255,.65);

  box-shadow:
    0 0 0 3px
    rgba(91,140,255,.10);
}

.input::placeholder{
  color:#8f95b0;
}

/* NOTES */

.send-btn{
  height:45px;

  border:0;
  border-radius:14px;

  padding:0 15px;

  background:
    linear-gradient(
      135deg,
      #5b8cff,
      #8b5cf6
    );

  color:white;

  font-weight:900;
  font-size:12px;

  cursor:pointer;

  box-shadow:
    0 8px 22px
    rgba(91,140,255,.25);

  transition:.2s;
}

.send-btn:active{
  transform:scale(.95);
}

.send-btn:disabled{
  opacity:.5;
}

/* VOICE */

.voice-btn.listening{
  background:
    linear-gradient(
      135deg,
      #ff315c,
      #b00036
    );

  border-color:
    rgba(255,100,130,.35);

  animation:pulse 1s infinite;
}

@keyframes pulse{
  50%{
    box-shadow:
      0 0 0 7px
      rgba(255,49,92,.08);
  }
}

/* CAMERA */

.camera-screen{
  position:fixed;
  inset:0;

  display:none;
  flex-direction:column;

  background:#000;

  z-index:5000;
}

.camera-screen.show{
  display:flex;
}

#cameraVideo{
  width:100%;
  height:100%;
  object-fit:cover;
}

.camera-top{
  position:absolute;

  top:0;
  left:0;
  right:0;

  padding:16px;

  z-index:2;
}

.camera-label{
  width:max-content;

  padding:8px 11px;

  border-radius:999px;

  background:rgba(0,0,0,.45);

  color:white;

  font-size:11px;

  border:1px solid
    rgba(255,255,255,.14);

  backdrop-filter:blur(12px);
}

.camera-controls{
  position:absolute;

  left:0;
  right:0;
  bottom:0;

  display:flex;

  justify-content:center;
  align-items:center;

  gap:25px;

  padding:
    20px
    20px
    calc(20px + env(safe-area-inset-bottom));

  background:
    linear-gradient(
      transparent,
      rgba(0,0,0,.75)
    );
}

.camera-close-btn{
  width:48px;
  height:48px;

  border-radius:50%;

  background:rgba(255,255,255,.13);

  color:white;

  font-size:22px;

  border:1px solid
    rgba(255,255,255,.18);

  cursor:pointer;
}

.camera-take-btn{
  width:70px;
  height:70px;

  border-radius:50%;

  background:white;

  border:6px solid
    rgba(255,255,255,.35);

  cursor:pointer;

  box-shadow:
    0 0 0 2px
    rgba(0,0,0,.35);
}

/* DESKTOP */

@media(min-width:700px){

  .chat{
    padding-left:
      max(13px,calc((100vw - 760px)/2));

    padding-right:
      max(13px,calc((100vw - 760px)/2));
  }

  .message{
    max-width:760px;
  }

  .hero,
  .quick-title,
  .quick-grid{
    max-width:760px;

    margin-left:auto;
    margin-right:auto;
  }

  .bottom{
    padding-left:
      max(10px,calc((100vw - 760px)/2));

    padding-right:
      max(10px,calc((100vw - 760px)/2));
  }
}

body.dark{
  background:var(--bg);
}

/* PPT preview inside Make Notes */
.ppt-preview{width:min(100%,760px);margin:8px auto 16px;padding:14px;border:1px solid rgba(108,99,255,.35);border-radius:20px;background:linear-gradient(145deg,rgba(22,27,54,.98),rgba(12,16,34,.98));box-shadow:0 18px 45px rgba(0,0,0,.25);color:#f7f8ff}
.ppt-preview-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:12px}
.ppt-preview-head h3{font-size:17px;margin:0 0 4px}.ppt-preview-head p{font-size:12px;color:#b8bfdc;margin:0;line-height:1.5}
.ppt-slide-list{display:grid;grid-template-columns:1fr;gap:12px}
.ppt-slide-card{overflow:hidden;border-radius:14px;background:#f7f8ff;color:#20264a;border:1px solid rgba(108,99,255,.2);box-shadow:0 8px 24px rgba(0,0,0,.16)}
.ppt-slide-top{padding:10px 12px;background:linear-gradient(110deg,#182044,#39356d);color:#fff;font-size:11px;font-weight:800;letter-spacing:.4px}
.ppt-slide-content{padding:13px}.ppt-slide-content h4{font-size:17px;line-height:1.25;margin:0 0 10px;color:#20264a}
.ppt-slide-content ul{padding-left:19px;margin:0;color:#414866;font-size:13px;line-height:1.5}.ppt-slide-content li{margin:0 0 6px}
.ppt-diagram{margin-top:12px;padding:10px;border-radius:12px;background:#edf0ff;border:1px solid #dce1ff}
.ppt-diagram-label{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.7px;color:#555c8c;margin-bottom:8px}
.ppt-flow{display:flex;align-items:stretch;justify-content:center;gap:5px;flex-wrap:wrap}
.ppt-flow-box{flex:1 1 75px;min-width:65px;max-width:150px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px 6px;border-radius:9px;background:white;border:1px solid #aeb9ff;color:#27305e;font-size:11px;font-weight:700;overflow-wrap:anywhere}
.ppt-flow-arrow{align-self:center;color:#6d63d8;font-size:18px;font-weight:900}
.ppt-download-btn{border:0;border-radius:12px;background:linear-gradient(110deg,#5b8cff,#9364ff);color:white;padding:12px 15px;font-size:13px;font-weight:800;cursor:pointer;box-shadow:0 8px 22px rgba(91,140,255,.25);width:100%;margin-top:13px}
.ppt-download-btn:disabled{opacity:.65;cursor:wait}.ppt-small-note{font-size:11px;line-height:1.5;color:#b8bfdc;margin-top:8px}
@media(min-width:650px){.ppt-slide-list{grid-template-columns:repeat(2,minmax(0,1fr))}.ppt-preview{padding:18px}}

</style>
  <script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
</head>

<body>

<div class="app">

  <!-- HEADER -->

  <header class="header">

    <button
      class="back-btn"
      id="backBtn"
      type="button"
    >
      ←
    </button>

    <div class="brand">

      <div class="brand-title">
        📚 Smart Notes with JR AI
      </div>

      <div class="brand-sub">
        Turn boring topics into study-ready notes.
      </div>

    </div>

    <div class="status-pill">
      <span class="status-dot"></span>
      JR READY
    </div>

  </header>


  <!-- CHAT -->

  <main
    class="chat"
    id="chat"
  >

    <section class="hero">

      <div class="hero-top">

        <div class="hero-icon">
          🧠
        </div>

        <div
          class="xp"
          id="xpLabel"
        >
          ⚡ Level 1 · 0 XP
        </div>

      </div>

      <h1>
        Let's make notes. Not excuses. 😭
      </h1>

      <p>
        Topic bhejo, JR AI usko clean,
        detailed aur student-friendly notes
        mein convert karega.
      </p>

    </section>


    <div class="quick-title">
      ⚡ QUICK START
    </div>


    <div class="quick-grid">

      <button
        class="quick"
        type="button"
        data-prompt="Explain this topic in very simple student-friendly language: "
      >
        <b>🧠 Explain Simply</b>
        <span>Hard topic → easy language</span>
      </button>

      <button
        class="quick"
        type="button"
        data-prompt="Create concise revision notes with only the most important points for: "
      >
        <b>📌 Key Points</b>
        <span>Fast revision mode</span>
      </button>

      <button
        class="quick"
        type="button"
        data-prompt="Generate important exam-style questions with answers from this topic: "
      >
        <b>❓ Questions</b>
        <span>Practice before exam</span>
      </button>

      <button
        class="quick"
        type="button"
        data-prompt="Create a short quiz to test my understanding of: "
      >
        <b>🎯 Mini Quiz</b>
        <span>Let's see what you remember</span>
      </button>

      <button
        class="quick"
        type="button"
        data-prompt="Turn this topic into concise flashcard-style revision points: "
      >
        <b>🃏 Flashcards</b>
        <span>Memory mode ON</span>
      </button>

      <button
        class="quick"
        type="button"
        data-prompt="Improve and organize these notes into clean headings, subheadings and bullet points: "
      >
        <b>✨ Improve Notes</b>
        <span>Messy → premium notes</span>
      </button>

      <button
        class="quick ppt-quick"
        type="button"
        id="pptModeBtn"
        data-ppt-mode="true"
      >
        <b>🎞️ PPT Maker</b>
        <span>Full chapter → PowerPoint</span>
      </button>

    </div>

  </main>


  <!-- BOTTOM -->

  <div class="bottom">

    <div class="pin-wrap">

      <button
        class="pin-btn"
        id="pinBtn"
        type="button"
        aria-label="Attach"
      >
        📎
      </button>


      <div
        class="pin-menu"
        id="pinMenu"
      >

        <button
          type="button"
          id="fileBtn"
        >
          📄 &nbsp;Choose File
        </button>

        <button
          type="button"
          id="albumBtn"
        >
          🖼️ &nbsp;Choose Images
        </button>

        <button
          type="button"
          id="cameraBtn"
        >
          📷 &nbsp;Open Camera
        </button>

      </div>

    </div>


    <input
      type="file"
      id="fileInput"
      hidden
    >

    <input
      type="file"
      id="albumInput"
      accept="image/*"
      multiple
      hidden
    >


    <input
      id="messageInput"
      class="input"
      type="text"
      placeholder="Topic likho… e.g. Photosynthesis"
      autocomplete="off"
    >


    <button
      id="sendBtn"
      class="send-btn"
      type="button"
    >
      ✨ NOTES
    </button>


    <button
      id="voiceBtn"
      class="voice-btn"
      type="button"
      aria-label="Voice input"
    >
      🎙️
    </button>

  </div>

</div>


<!-- CAMERA -->

<div
  class="camera-screen"
  id="cameraScreen"
>

  <div class="camera-top">

    <div class="camera-label">
      📷 JR AI Camera
    </div>

  </div>

  <video
    id="cameraVideo"
    autoplay
    playsinline
  ></video>

  <div class="camera-controls">

    <button
      type="button"
      id="cameraCloseBtn"
      class="camera-close-btn"
    >
      ✕
    </button>

    <button
      type="button"
      id="cameraTakeBtn"
      class="camera-take-btn"
    ></button>

  </div>

</div>


<script>
'use strict';

/* JR AI MAKE NOTES — standalone, self-contained script */
const API_URL = "https://script.google.com/macros/s/AKfycbwyW1sNFAI9lgYH_7_FWng44IWUUrbIadwPMRM6vrmw84C8w41rWvBkACuIAasVmAHT/exec";
const $ = (id) => document.getElementById(id);
const chat = $('chat');
const messageInput = $('messageInput');
const sendBtn = $('sendBtn');
const pinBtn = $('pinBtn');
const pinMenu = $('pinMenu');
const fileBtn = $('fileBtn');
const albumBtn = $('albumBtn');
const cameraBtn = $('cameraBtn');
const fileInput = $('fileInput');
const albumInput = $('albumInput');
const voiceBtn = $('voiceBtn');
const cameraScreen = $('cameraScreen');
const cameraVideo = $('cameraVideo');
const cameraCloseBtn = $('cameraCloseBtn');
const cameraTakeBtn = $('cameraTakeBtn');
const pptModeBtn = $('pptModeBtn');
const backBtn = $('backBtn');
const xpLabel = $('xpLabel');

let isSending = false;
let pptMode = false;
let selectedQuickPrompt = '';
let selectedFiles = [];
let cameraStream = null;
let recognition = null;
let xp = Number(localStorage.getItem('jr_ai_notes_xp') || 0);

function getUserId() {
  let id = localStorage.getItem('jr_ai_user_id');
  if (!id) {
    id = 'jr_' + Date.now() + '_' + Math.random().toString(36).slice(2);
    localStorage.setItem('jr_ai_user_id', id);
  }
  return id;
}
function scrollToBottom() {
  requestAnimationFrame(() => { chat.scrollTop = chat.scrollHeight; });
}
function addMessage(text, type='ai') {
  const el = document.createElement('div');
  el.className = 'message ' + type;
  el.textContent = String(text ?? '');
  chat.appendChild(el);
  scrollToBottom();
  return el;
}
function showTyping() {
  hideTyping();
  const el = document.createElement('div');
  el.className = 'typing'; el.id = 'typingIndicator';
  for (let i=0;i<3;i++) { const dot=document.createElement('div'); dot.className='dot'; el.appendChild(dot); }
  chat.appendChild(el); scrollToBottom();
}
function hideTyping() { const el=$('typingIndicator'); if (el) el.remove(); }
function updateXP(amount=0) {
  xp += amount; localStorage.setItem('jr_ai_notes_xp', String(xp));
  if (xpLabel) xpLabel.textContent = `⚡ Level ${Math.floor(xp/100)+1} · ${xp} XP`;
}
function setMode(isPpt) {
  pptMode = isPpt;
  if (pptModeBtn) pptModeBtn.classList.toggle('selected', pptMode);
  document.querySelectorAll('.quick[data-prompt]').forEach(b=>b.classList.remove('selected'));
  if (pptMode) selectedQuickPrompt='';
  messageInput.placeholder = pptMode ? 'Chapter ya topic likho... e.g. Photosynthesis' : 'Topic likho… e.g. Photosynthesis';
  sendBtn.textContent = pptMode ? '🎞️ MAKE PPT' : '✨ NOTES';
}
function renderAttachments() {
  let old = $('attachmentStatus'); if (old) old.remove();
  if (!selectedFiles.length) return;
  const status=document.createElement('div'); status.id='attachmentStatus'; status.className='attachment-status';
  status.style.cssText='font-size:12px;color:var(--muted);padding:5px 8px;max-width:100%;overflow-wrap:anywhere;';
  status.textContent='📎 ' + selectedFiles.map(f=>f.name).join(', ');
  document.querySelector('.bottom').prepend(status);
}
function clearAttachments() { selectedFiles=[]; fileInput.value=''; albumInput.value=''; renderAttachments(); }
function openPicker(input) { if (input) { input.click(); if (pinMenu) pinMenu.classList.remove('show'); } }
async function readTextFile(file) {
  if (/\.(txt|md|csv|json|html|js|css|xml)$/i.test(file.name) || file.type.startsWith('text/')) {
    try { return `\n\nAttached text file (${file.name}):\n` + (await file.text()).slice(0,18000); } catch (_) { return `\nAttached file: ${file.name}`; }
  }
  return `\n\nUser attached file: ${file.name} (${file.type || 'unknown type'}). If its contents are not provided, tell the user you cannot read the file contents in this chat.`;
}
async function createNotes() {
  if (isSending) return;
  const topic = messageInput.value.trim();
  if (!topic && !selectedFiles.length) { messageInput.focus(); return; }
  if (pptMode && selectedFiles.length) {
    addMessage('PPT Maker abhi topic/text se PPT banata hai. Attached file ka text copy karke topic box mein paste kar do.', 'ai');
    return;
  }
  if (pptMode) return createPowerPoint(topic);

  isSending=true; sendBtn.disabled=true; messageInput.disabled=true; voiceBtn.disabled=true;
  const userText = topic || 'Please make study notes from my attached file.';
  addMessage(userText + (selectedFiles.length ? '\n📎 ' + selectedFiles.map(f=>f.name).join(', ') : ''), 'user');
  messageInput.value=''; showTyping();
  try {
    let attachmentText='';
    for (const file of selectedFiles) attachmentText += await readTextFile(file);
    const prompt = (selectedQuickPrompt ? selectedQuickPrompt : 'Create detailed, well-organized, student-friendly notes on this topic: ') + userText + attachmentText + '\nInclude clear headings, definitions, important points, explanations, examples where useful, key terms, and a concise revision summary. Cover the topic thoroughly and make the notes easy to study.';
    selectedQuickPrompt=''; document.querySelectorAll('.quick[data-prompt]').forEach(b=>b.classList.remove('selected'));
    clearAttachments();
    const controller=new AbortController(); const timeout=setTimeout(()=>controller.abort(),60000);
    let response;
    try {
      response=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({message:prompt,userId:getUserId()}),signal:controller.signal});
    } finally { clearTimeout(timeout); }
    if (!response.ok) throw new Error('Server error: '+response.status);
    const data=await response.json();
    if (data && data.error) throw new Error(data.error);
    const answer=data && data.answer ? String(data.answer).trim() : '';
    if (!answer) throw new Error('AI ne empty response diya. Please try again.');
    hideTyping(); addMessage(answer,'ai'); updateXP(10);
  } catch (err) {
    hideTyping();
    let msg = err && err.name==='AbortError' ? 'Server response mein zyada time lag raha hai. Dobara try karo.' : (err && err.message ? err.message : 'Kuch problem aa gayi.');
    if (location.protocol === 'file:') msg += '\n\nAap file ko direct Chrome (file://) se chala rahe ho. API, microphone aur camera ke liye GitHub Pages wali https:// website par test karo.';
    addMessage('⚠️ Notes nahi ban paaye: '+msg,'ai');
  } finally {
    isSending=false; sendBtn.disabled=false; messageInput.disabled=false; voiceBtn.disabled=false;
    sendBtn.textContent=pptMode?'🎞️ MAKE PPT':'✨ NOTES'; messageInput.focus({preventScroll:true}); scrollToBottom();
  }
}
let currentPptx = null;
let currentPptFilename = 'JR-AI-Presentation.pptx';

function parsePptSlides(raw) {
  const lines=String(raw||'').replace(/```[\w-]*\n?/g,'').replace(/```/g,'').replace(/\r/g,'').split('\n');
  const slides=[]; let current=null;
  for (const line of lines) {
    const trimmed=line.trim();
    const m=trimmed.match(/^\*{0,2}SLIDE\s*\d+\s*[:.)\-–]\s*(.*?)\*{0,2}$/i);
    if (m) { if(current) slides.push(current); current={title:m[1].replace(/^\*+|\*+$/g,'').trim(),bullets:[],diagram:[]}; }
    else if(current && trimmed) {
      const dm=trimmed.match(/^DIAGRAM\s*:\s*(.*)$/i);
      if(dm) current.diagram=dm[1].split(/\s*(?:->|→|\|)\s*/).map(t=>t.replace(/^[-*•]\s*/,'').trim()).filter(Boolean).slice(0,5);
      else { const t=trimmed.replace(/^[-*•]\s*/,'').replace(/^\d+[.)]\s*/,'').replace(/^\*+|\*+$/g,'').trim(); if(t) current.bullets.push(t); }
    }
  }
  if(current) slides.push(current);
  const result=slides.filter(s=>s.title || s.bullets.length).slice(0,20);
  result.forEach((s,i)=>{if(!s.diagram.length) s.diagram=deriveDiagram(s,i);});
  return result;
}
function deriveDiagram(slide,index) {
  const clean=slide.bullets.map(t=>t.replace(/^[^:]{1,35}:\s*/, '').replace(/[.!?]+$/,'').trim()).filter(Boolean);
  if(index===0) return ['TOPIC','Main Ideas','Learn & Revise'];
  if(/process|step|cycle|life cycle|working|mechanism|how/i.test(slide.title+' '+slide.bullets.join(' '))) return (clean.slice(0,4).length>=2?clean.slice(0,4):['Start','Process','Result']);
  if(/compare|difference|types|classification/i.test(slide.title+' '+slide.bullets.join(' '))) return ['Types / Ideas','Compare','Choose / Result'];
  return clean.slice(0,4).length>=2?clean.slice(0,4):[slide.title||'Concept','Explanation','Example','Summary'];
}
function addDiagramToSlide(slide,pptx,items,cover) {
  const nodes=(items||[]).slice(0,4); if(nodes.length<2) return;
  const x0=cover?0.8:6.7, y0=cover?5.15:2.15, totalW=cover?10.9:5.75, boxW=Math.min(1.42,(totalW-(nodes.length-1)*0.28)/nodes.length), gap=nodes.length>1?(totalW-boxW*nodes.length)/(nodes.length-1):0;
  nodes.forEach((txt,i)=>{
    const x=x0+i*(boxW+gap);
    slide.addShape(pptx.ShapeType.roundRect,{x,y:y0,w:boxW,h:0.72,rectRadius:0.08,line:{color:cover?'8DA2FF':'8C8AF4',width:1},fill:{color:cover?'252F60':'E9ECFF'}});
    slide.addText(String(txt).slice(0,65),{x:x+0.05,y:y0+0.08,w:boxW-0.1,h:0.56,fontFace:'Aptos',fontSize:Math.min(12,boxW*8),bold:true,color:cover?'FFFFFF':'27305E',align:'center',valign:'mid',fit:'shrink',margin:0.02});
    if(i<nodes.length-1) slide.addText('→',{x:x+boxW,y:y0+0.19,w:gap,h:0.28,fontFace:'Aptos',fontSize:16,bold:true,color:cover?'B8C4FF':'655BCE',align:'center',margin:0});
  });
}
function renderPptPreview(topic,slides) {
  const wrap=document.createElement('section'); wrap.className='ppt-preview';
  const head=document.createElement('div'); head.className='ppt-preview-head';
  const intro=document.createElement('div');
  const title=document.createElement('h3'); title.textContent='🎞️ Your PPT is ready to preview';
  const sub=document.createElement('p'); sub.textContent=`${topic} · ${slides.length} slides · Check the explanation and diagrams below before downloading.`;
  intro.append(title,sub); head.appendChild(intro); wrap.appendChild(head);
  const list=document.createElement('div'); list.className='ppt-slide-list';
  slides.forEach((data,i)=>{
    const card=document.createElement('article'); card.className='ppt-slide-card';
    const top=document.createElement('div'); top.className='ppt-slide-top'; top.textContent=`SLIDE ${String(i+1).padStart(2,'0')} / ${String(slides.length).padStart(2,'0')}`;
    const content=document.createElement('div'); content.className='ppt-slide-content';
    const h=document.createElement('h4'); h.textContent=data.title||`Slide ${i+1}`; content.appendChild(h);
    const ul=document.createElement('ul'); data.bullets.forEach(b=>{const li=document.createElement('li');li.textContent=b;ul.appendChild(li);}); content.appendChild(ul);
    const diagram=document.createElement('div'); diagram.className='ppt-diagram';
    const dl=document.createElement('div'); dl.className='ppt-diagram-label'; dl.textContent='Visual diagram'; diagram.appendChild(dl);
    const flow=document.createElement('div'); flow.className='ppt-flow';
    (data.diagram||deriveDiagram(data,i)).forEach((node,j,arr)=>{const box=document.createElement('div');box.className='ppt-flow-box';box.textContent=node;flow.appendChild(box);if(j<arr.length-1){const arrow=document.createElement('div');arrow.className='ppt-flow-arrow';arrow.textContent='→';flow.appendChild(arrow);}});
    diagram.appendChild(flow); content.appendChild(diagram); card.append(top,content); list.appendChild(card);
  });
  wrap.appendChild(list);
  const download=document.createElement('button'); download.type='button'; download.className='ppt-download-btn'; download.textContent='⬇️ Download PowerPoint (.pptx)';
  download.addEventListener('click',async()=>{
    if(!currentPptx){addMessage('⚠️ PPT file ready nahi hai. Topic dobara generate karo.','ai');return;}
    download.disabled=true; download.textContent='⏳ Preparing download…';
    try { await currentPptx.writeFile({fileName:currentPptFilename}); download.textContent='✅ Download started — tap again if needed'; updateXP(5); }
    catch(e){download.textContent='❌ Download failed — tap to retry';addMessage('⚠️ Download nahi hua: '+(e.message||'Please Chrome mein download permission check karo.'),'ai');}
    finally {download.disabled=false;}
  });
  wrap.appendChild(download);
  const note=document.createElement('div');note.className='ppt-small-note';note.textContent='PPT is shown here first. Download tabhi hoga jab aap upar button tap karoge. Diagrams are included in the preview and PowerPoint slides.';wrap.appendChild(note);
  chat.appendChild(wrap); scrollToBottom();
}
async function createPowerPoint(topic) {
  if (!topic) { messageInput.focus(); return; }
  if (!window.pptxgen && !window.PptxGenJS) { addMessage('⚠️ PowerPoint library load nahi hui. Internet on karke GitHub Pages https:// website par reload karo.','ai'); return; }
  isSending=true; sendBtn.disabled=true; messageInput.disabled=true; voiceBtn.disabled=true;
  addMessage('🎞️ PPT ke liye topic: '+topic,'user'); messageInput.value=''; showTyping();
  const prompt=`You are an excellent teacher who makes clear visual lessons for students. Create a thorough, easy-to-understand PowerPoint lesson on: ${topic}. Assume the learner is a beginner. Use 10 to 14 slides for a full chapter (or 8+ slides for a small topic). Explain concepts in simple everyday language, define every important term, explain WHY and HOW things happen, use a relatable real-life analogy and at least 2 worked examples where relevant, add common mistakes/misconceptions, exam tips, recap and conclusion. Avoid vague or overly short bullets; each bullet should teach a complete useful idea in plain language. Include at least one clear visual flow/process/concept diagram on EVERY slide except a pure title slide. Use only accurate topic-specific diagram labels and order. Return ONLY this exact structure: SLIDE 1: Title, then 3-5 lines beginning '- ' and one line 'DIAGRAM: label 1 -> label 2 -> label 3' (2 to 5 short labels). Repeat for each slide. Diagram should be a meaningful process, cycle, hierarchy, comparison, structure or concept map relevant to that particular slide, not generic filler. First slide may be title/learning goals; include an overview, foundational concepts, detailed explanation, process/mechanism, real-world applications, worked example(s), common errors, recap and conclusion. Do not use markdown tables, do not add intro text outside slide format.`;
  const controller=new AbortController(); const timeout=setTimeout(()=>controller.abort(),90000);
  try {
    const response=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({message:prompt,userId:getUserId()}),signal:controller.signal});
    if(!response.ok) throw new Error('Server error: '+response.status);
    const data=await response.json(); if(data && data.error) throw new Error(data.error);
    const answer=data && data.answer ? String(data.answer).trim() : ''; if(!answer) throw new Error('AI ne empty response diya.');
    const slides=parsePptSlides(answer); if(!slides.length) throw new Error('AI ka slide format samajh nahi aaya. Dobara try karo.');
    const Pptx=window.pptxgen||window.PptxGenJS; const pptx=new Pptx();
    pptx.layout='LAYOUT_WIDE'; pptx.author='JR AI'; pptx.subject='AI-generated study presentation'; pptx.title=topic; pptx.company='JR AI';
    pptx.theme={headFontFace:'Aptos Display',bodyFontFace:'Aptos',lang:'en-US'};
    slides.forEach((d,i)=>{
      const slide=pptx.addSlide(); const cover=i===0; slide.background={color:cover?'101633':(i%2?'F5F7FF':'FFFFFF')};
      slide.addShape(pptx.ShapeType.rect,{x:0,y:0,w:0.18,h:7.5,line:{color:'6C63FF',transparency:100},fill:{color:'6C63FF'}});
      slide.addText(d.title||('Slide '+(i+1)),{x:0.65,y:cover?0.55:0.4,w:11.8,h:cover?0.95:0.7,fontFace:'Aptos Display',fontSize:cover?30:24,bold:true,color:cover?'FFFFFF':'20264A',margin:0.05,fit:'shrink'});
      slide.addShape(pptx.ShapeType.line,{x:0.68,y:cover?1.55:1.2,w:1.2,h:0,line:{color:'6C63FF',width:3}});
      const bullets=d.bullets.slice(0,5).map(t=>({text:t,options:{bullet:{indent:14},hanging:3,breakLine:true,paraSpaceAfterPt:8}}));
      if(bullets.length) slide.addText(bullets,{x:0.78,y:cover?1.85:1.48,w:cover?10.9:5.45,h:cover?2.65:4.85,fontFace:'Aptos',fontSize:cover?18:15,color:cover?'E8ECFF':'343B5B',margin:0.08,valign:'top',fit:'shrink',paraSpaceAfterPt:8,breakLine:false});
      addDiagramToSlide(slide,pptx,d.diagram,cover);
      slide.addText('JR AI • STUDY PRESENTATION',{x:0.7,y:7.1,w:10.7,h:0.22,fontFace:'Aptos',fontSize:9,color:cover?'AAB4E8':'7A819D',margin:0});
      slide.addText(String(i+1).padStart(2,'0'),{x:11.85,y:7.08,w:0.7,h:0.25,fontFace:'Aptos',fontSize:10,bold:true,color:cover?'FFFFFF':'626B91',align:'right',margin:0});
    });
    const safe=topic.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,55)||'jr-ai-presentation';
    currentPptx=pptx; currentPptFilename=safe+'-JR-AI.pptx';
    hideTyping(); renderPptPreview(topic,slides); addMessage(`✅ ${slides.length} slides ready hain. Neeche preview dekho; download ke liye “Download PowerPoint” button tap karo.`,'ai'); updateXP(20);
  } catch(err) {
    hideTyping(); let msg=err&&err.name==='AbortError'?'Server response mein time lag raha hai. Dobara try karo.':(err&&err.message?err.message:'Unknown error');
    if(location.protocol==='file:') msg+='\nDirect file:// ke bajay GitHub Pages https:// URL use karo.';
    addMessage('⚠️ PPT nahi ban paayi: '+msg,'ai');
  } finally {
    clearTimeout(timeout); isSending=false; sendBtn.disabled=false; messageInput.disabled=false; voiceBtn.disabled=false;
    sendBtn.textContent=pptMode?'🎞️ MAKE PPT':'✨ NOTES'; messageInput.focus({preventScroll:true}); scrollToBottom();
  }
}

/* Quick prompt and PPT mode */
if (pptModeBtn) pptModeBtn.addEventListener('click',()=>{ setMode(!pptMode); if(pptMode) addMessage('🎞️ PPT Maker mode ON. Chapter/topic likho aur MAKE PPT dabao.','ai'); });
document.querySelectorAll('.quick[data-prompt]').forEach(button=>button.addEventListener('click',()=>{
  selectedQuickPrompt=button.getAttribute('data-prompt')||''; setMode(false); button.classList.add('selected');
  messageInput.placeholder='Topic likho, phir NOTES dabao...'; messageInput.focus({preventScroll:true});
}));
sendBtn.addEventListener('click',createNotes);
messageInput.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();createNotes();}});
if(backBtn) backBtn.addEventListener('click',()=>{ if(history.length>1) history.back(); else location.href='index.html'; });

/* File and photo picker */
if(pinBtn) pinBtn.addEventListener('click',e=>{e.stopPropagation(); if(pinMenu) pinMenu.classList.toggle('show');});
document.addEventListener('click',e=>{if(pinMenu && !pinMenu.contains(e.target) && e.target!==pinBtn) pinMenu.classList.remove('show');});
if(fileBtn) fileBtn.addEventListener('click',()=>openPicker(fileInput));
if(albumBtn) albumBtn.addEventListener('click',()=>openPicker(albumInput));
if(fileInput) fileInput.addEventListener('change',()=>{selectedFiles=[...selectedFiles,...Array.from(fileInput.files||[])];renderAttachments();if(selectedFiles.length)addMessage('📎 File selected: '+selectedFiles.map(f=>f.name).join(', ')+'. Ab topic/question likh kar NOTES dabao. Text files (.txt/.md/.csv) ka text notes mein include hoga.','ai');});
if(albumInput) albumInput.addEventListener('change',()=>{selectedFiles=[...selectedFiles,...Array.from(albumInput.files||[])];renderAttachments();if(selectedFiles.length)addMessage('🖼️ Image select ho gayi. Image attach karne ka control kaam kar raha hai, lekin current text API image ko directly read nahi karti. Image se notes banane ke liye OCR/vision backend add karna hoga.','ai');});

/* Voice typing: requires Chrome HTTPS / microphone permission */
if(voiceBtn) voiceBtn.addEventListener('click',()=>{
  const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SpeechRecognition){addMessage('🎙️ Is Chrome mode mein voice typing supported nahi hai. GitHub Pages HTTPS par latest Chrome use karo, ya keyboard ka microphone use karo.','ai');return;}
  if(recognition){try{recognition.stop();}catch(_){} recognition=null;voiceBtn.classList.remove('listening');voiceBtn.textContent='🎙️';return;}
  recognition=new SpeechRecognition(); recognition.lang='hi-IN'; recognition.interimResults=false; recognition.continuous=false;
  recognition.onstart=()=>{voiceBtn.classList.add('listening');voiceBtn.textContent='⏹️';addMessage('🎙️ Sun raha hoon… ab bolo.','ai');};
  recognition.onresult=e=>{const text=e.results&&e.results[0]&&e.results[0][0]?e.results[0][0].transcript:''; if(text) messageInput.value=(messageInput.value+' '+text).trim();};
  recognition.onerror=e=>addMessage('⚠️ Voice input error: '+(e.error||'microphone permission check karo'),'ai');
  recognition.onend=()=>{recognition=null;voiceBtn.classList.remove('listening');voiceBtn.textContent='🎙️';messageInput.focus({preventScroll:true});};
  try{recognition.start();}catch(e){addMessage('⚠️ Microphone start nahi hua. Chrome permission check karo.','ai');}
});

/* Camera capture */
async function closeCamera(){if(cameraStream){cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null;} if(cameraVideo)cameraVideo.srcObject=null; if(cameraScreen)cameraScreen.classList.remove('show');}
if(cameraBtn) cameraBtn.addEventListener('click',async()=>{
  if(pinMenu)pinMenu.classList.remove('show');
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){addMessage('📷 Camera ke liye page HTTPS (GitHub Pages) par kholo; file:// mode camera ko block kar sakta hai.','ai');return;}
  try{cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});cameraVideo.srcObject=cameraStream;cameraScreen.classList.add('show');await cameraVideo.play();}
  catch(e){addMessage('⚠️ Camera open nahi hua: '+(e.message||'Chrome site permission allow karo.'),'ai');}
});
if(cameraCloseBtn)cameraCloseBtn.addEventListener('click',closeCamera);
if(cameraTakeBtn)cameraTakeBtn.addEventListener('click',()=>{
  if(!cameraVideo||!cameraVideo.videoWidth){addMessage('⚠️ Camera frame abhi ready nahi hai.','ai');return;}
  const canvas=document.createElement('canvas');canvas.width=cameraVideo.videoWidth;canvas.height=cameraVideo.videoHeight;canvas.getContext('2d').drawImage(cameraVideo,0,0);
  canvas.toBlob(blob=>{if(blob){const f=new File([blob],'jr-ai-camera-'+Date.now()+'.jpg',{type:'image/jpeg'});selectedFiles.push(f);renderAttachments();addMessage('📷 Photo capture ho gayi. Current AI API image ko directly analyze nahi karti; OCR/vision backend ke baad hi photo se answers milenge.','ai');}closeCamera();},'image/jpeg',0.9);
});

/* Theme shortcut: double-tap header brand to toggle theme */
const brandTitle=document.querySelector('.brand-title');
if(brandTitle){brandTitle.title='Double-tap to switch theme';brandTitle.addEventListener('dblclick',()=>{document.body.classList.toggle('dark');localStorage.setItem('jr_ai_theme',document.body.classList.contains('dark')?'dark':'light');});}
if(localStorage.getItem('jr_ai_theme')==='dark')document.body.classList.add('dark');
updateXP(0);
</script>
