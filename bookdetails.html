<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JR AI Book</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#f4f6fb;
  --card:#ffffff;
  --text:#111827;
  --muted:#6b7280;
  --line:#e5e7eb;
  --primary:#111827;
  --soft:#eef1f7;
}

body.dark{
  --bg:#0f172a;
  --card:#182235;
  --text:#f8fafc;
  --muted:#aab4c5;
  --line:#293548;
  --primary:#e5e7eb;
  --soft:#243044;
}

body{
  font-family:Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  transition:.25s;
}

header{
  position:sticky;
  top:0;
  z-index:20;
  height:62px;
  background:var(--card);
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 15px;
}

.header-left{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
}

.back-top{
  width:40px;
  height:40px;
  border:0;
  border-radius:12px;
  background:var(--soft);
  color:var(--text);
  font-size:20px;
  cursor:pointer;
}

.header-title{
  font-size:18px;
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.header-actions{
  display:flex;
  gap:8px;
}

.icon-btn{
  width:40px;
  height:40px;
  border:0;
  border-radius:12px;
  background:var(--soft);
  color:var(--text);
  font-size:18px;
  cursor:pointer;
}

.container{
  width:min(950px,100%);
  margin:auto;
  padding:18px 15px 35px;
}

.book-card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:20px;
  padding:18px;
  box-shadow:0 8px 25px rgba(0,0,0,.06);
}

.book-top{
  display:flex;
  gap:18px;
  align-items:center;
}

.cover{
  width:115px;
  height:160px;
  flex-shrink:0;
  border-radius:15px;
  object-fit:cover;
  background:linear-gradient(145deg,#111827,#374151);
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-size:35px;
  box-shadow:0 8px 20px rgba(0,0,0,.18);
}

.book-meta{
  min-width:0;
}

.book-meta h1{
  font-size:23px;
  margin-bottom:8px;
}

.book-meta p{
  color:var(--muted);
  line-height:1.5;
  font-size:14px;
}

.search-box{
  margin-top:20px;
  position:relative;
}

.search-box input{
  width:100%;
  height:52px;
  border:1px solid var(--line);
  border-radius:16px;
  outline:none;
  padding:0 48px 0 17px;
  background:var(--card);
  color:var(--text);
  font-size:15px;
  box-shadow:0 5px 15px rgba(0,0,0,.04);
}

.search-box input:focus{
  border-color:#64748b;
}

.search-icon{
  position:absolute;
  right:16px;
  top:50%;
  transform:translateY(-50%);
  font-size:21px;
  pointer-events:none;
}

.reader-controls{
  margin-top:16px;
  display:flex;
  gap:10px;
}

.main-btn{
  flex:1;
  height:48px;
  border:0;
  border-radius:14px;
  background:var(--primary);
  color:var(--card);
  font-size:15px;
  font-weight:800;
  cursor:pointer;
}

.secondary-btn{
  height:48px;
  padding:0 18px;
  border:0;
  border-radius:14px;
  background:var(--soft);
  color:var(--text);
  font-weight:700;
  cursor:pointer;
}

.chapter-panel{
  margin-top:18px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:20px;
  overflow:hidden;
}

.panel-head{
  padding:16px;
  border-bottom:1px solid var(--line);
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.panel-head h2{
  font-size:17px;
}

.chapter-count{
  color:var(--muted);
  font-size:13px;
}

.chapter-list{
  max-height:420px;
  overflow-y:auto;
}

.chapter-item{
  width:100%;
  text-align:left;
  border:0;
  border-bottom:1px solid var(--line);
  background:transparent;
  color:var(--text);
  padding:16px;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:12px;
}

.chapter-item:last-child{
  border-bottom:0;
}

.chapter-number{
  width:36px;
  height:36px;
  border-radius:11px;
  background:var(--soft);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
  flex-shrink:0;
}

.chapter-name{
  font-size:15px;
  font-weight:700;
}

.reader{
  display:none;
  margin-top:18px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:20px;
  overflow:hidden;
}

.reader-head{
  padding:17px;
  border-bottom:1px solid var(--line);
}

.reader-head small{
  color:var(--muted);
}

.reader-head h2{
  margin-top:6px;
  font-size:23px;
}

.progress{
  height:5px;
  background:var(--soft);
}

.progress-bar{
  height:100%;
  width:0;
  background:#64748b;
  transition:.25s;
}

.article{
  padding:20px 17px 30px;
  line-height:1.8;
  font-size:16px;
}

.article h3{
  margin:20px 0 8px;
}

.article p{
  margin-bottom:14px;
}

.reader-nav{
  display:flex;
  gap:10px;
  padding:15px;
  border-top:1px solid var(--line);
}

.reader-nav button{
  flex:1;
  height:46px;
  border:0;
  border-radius:13px;
  cursor:pointer;
  font-weight:800;
}

.prev-btn,
.next-btn{
  background:var(--soft);
  color:var(--text);
}

.home-btn{
  background:var(--primary);
  color:var(--card);
}

.empty{
  padding:30px 15px;
  text-align:center;
  color:var(--muted);
}

@media(max-width:600px){
  .book-top{
    align-items:flex-start;
  }

  .cover{
    width:90px;
    height:125px;
  }

  .book-meta h1{
    font-size:20px;
  }

  .reader-controls{
    flex-direction:column;
  }

  .secondary-btn{
    width:100%;
  }

  .reader-nav{
    position:sticky;
    bottom:0;
    background:var(--card);
  }
}
</style>
</head>

<body>

<header>

  <div class="header-left">

    <button class="back-top" id="backTop">
      ←
    </button>

    <div class="header-title" id="headerTitle">
      JR AI Book
    </div>

  </div>

  <div class="header-actions">

    <button class="icon-btn" id="themeBtn">
      🌙
    </button>

  </div>

</header>

<div class="container">

  <section class="book-card">

    <div class="book-top">

      <div class="cover" id="bookCover">
        📖
      </div>

      <div class="book-meta">

        <h1 id="bookTitle">
          Book Title
        </h1>

        <p id="bookDescription">
          Select a book from JR AI Book Store.
        </p>

      </div>

    </div>

    <div class="search-box">

      <input
        type="text"
        id="searchInput"
        placeholder="🔎 Search chapters..."
      >

      <span class="search-icon">
        🔍
      </span>

    </div>

    <div class="reader-controls">

      <button class="main-btn" id="startBtn">
        📖 Start Reading
      </button>

      <button class="secondary-btn" id="chapterBtn">
        📚 Chapters
      </button>

    </div>

  </section>

  <section class="chapter-panel" id="chapterPanel">

    <div class="panel-head">

      <h2>
        📚 Chapters
      </h2>

      <span class="chapter-count" id="chapterCount">
        0 Chapters
      </span>

    </div>

    <div class="chapter-list" id="chapterList">

      <div class="empty">
        No chapters available yet.
      </div>

    </div>

  </section>

  <section class="reader" id="reader">

    <div class="reader-head">

      <small id="readerBookTitle">
        JR AI Book
      </small>

      <h2 id="readerChapterTitle">
        Chapter
      </h2>

    </div>

    <div class="progress">

      <div class="progress-bar" id="progressBar"></div>

    </div>

    <article class="article" id="article">

      Select a chapter to start reading.

    </article>

    <div class="reader-nav">

      <button class="prev-btn" id="prevBtn">
        ← Previous
      </button>

      <button class="home-btn" id="homeBtn">
        📚 Chapters
      </button>

      <button class="next-btn" id="nextBtn">
        Next →
      </button>

    </div>

  </section>

</div>

<script>

/* =========================
   BOOK DATA
   ========================= */

const selectedBook =
  localStorage.getItem("jr_selected_book") ||
  "JR AI Book";

const selectedCover =
  localStorage.getItem("jr_selected_cover") ||
  "";

const chapters = [];


/* =========================
   BASIC ELEMENTS
   ========================= */

const headerTitle =
  document.getElementById("headerTitle");

const bookTitle =
  document.getElementById("bookTitle");

const bookDescription =
  document.getElementById("bookDescription");

const bookCover =
  document.getElementById("bookCover");

const chapterCount =
  document.getElementById("chapterCount");

const chapterList =
  document.getElementById("chapterList");

const reader =
  document.getElementById("reader");

const chapterPanel =
  document.getElementById("chapterPanel");

const article =
  document.getElementById("article");

const readerChapterTitle =
  document.getElementById("readerChapterTitle");

const readerBookTitle =
  document.getElementById("readerBookTitle");

const progressBar =
  document.getElementById("progressBar");

const searchInput =
  document.getElementById("searchInput");

const startBtn =
  document.getElementById("startBtn");

const chapterBtn =
  document.getElementById("chapterBtn");

const prevBtn =
  document.getElementById("prevBtn");

const nextBtn =
  document.getElementById("nextBtn");

const homeBtn =
  document.getElementById("homeBtn");

const backTop =
  document.getElementById("backTop");

const themeBtn =
  document.getElementById("themeBtn");


/* =========================
   BOOK HEADER
   ========================= */

bookTitle.textContent =
  selectedBook;

headerTitle.textContent =
  selectedBook;

bookDescription.textContent =
  "Your selected JR AI book. Chapters and study content will appear here.";


/* =========================
   COVER
   ========================= */

if(selectedCover){

  bookCover.style.backgroundImage =
    "url('" + selectedCover + "')";

  bookCover.style.backgroundSize =
    "cover";

  bookCover.style.backgroundPosition =
    "center";

  bookCover.textContent = "";

}


/* =========================
   CHAPTER COUNT
   ========================= */

function updateChapterCount(){

  chapterCount.textContent =
    chapters.length + " Chapters";

}


/* =========================
   CHAPTER LIST
   ========================= */

function renderChapters(){

  chapterList.innerHTML = "";

  if(chapters.length === 0){

    chapterList.innerHTML =
      '<div class="empty">📚 No chapters added yet.</div>';

    updateChapterCount();

    return;
  }

  chapters.forEach(function(chapter,index){

    const button =
      document.createElement("button");

    button.className =
      "chapter-item";

    button.innerHTML =
      '<span class="chapter-number">' +
      (index + 1) +
      '</span>' +
      '<span class="chapter-name">' +
      chapter.title +
      '</span>';

    button.onclick = function(){

      openChapter(index);

    };

    chapterList.appendChild(button);

  });

  updateChapterCount();

}


/* =========================
   OPEN CHAPTER
   ========================= */

let currentChapter = 0;

function openChapter(index){

  if(!chapters.length) return;

  currentChapter = index;

  const chapter =
    chapters[currentChapter];

  reader.style.display =
    "block";

  chapterPanel.style.display =
    "none";

  article.innerHTML =
    chapter.content;

  readerChapterTitle.textContent =
    chapter.title;

  readerBookTitle.textContent =
    selectedBook;

  updateNavigation();

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =========================
   NAVIGATION
   ========================= */

function updateNavigation(){

  prevBtn.disabled =
    currentChapter === 0;

  nextBtn.disabled =
    currentChapter === chapters.length - 1;

  if(chapters.length > 0){

    const progress =
      ((currentChapter + 1) /
      chapters.length) * 100;

    progressBar.style.width =
      progress + "%";

  }

}


prevBtn.onclick = function(){

  if(currentChapter > 0){

    openChapter(
      currentChapter - 1
    );

  }

};


nextBtn.onclick = function(){

  if(
    currentChapter <
    chapters.length - 1
  ){

    openChapter(
      currentChapter + 1
    );

  }

};


/* =========================
   START READING
   ========================= */

startBtn.onclick = function(){

  if(chapters.length){

    openChapter(0);

  }else{

    alert(
      "📚 Chapters will be added to this book soon."
    );

  }

};


/* =========================
   CHAPTER BUTTON
   ========================= */

chapterBtn.onclick = function(){

  reader.style.display =
    "none";

  chapterPanel.style.display =
    "block";

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

};


/* =========================
   HOME / CHAPTERS
   ========================= */

homeBtn.onclick = function(){

  reader.style.display =
    "none";

  chapterPanel.style.display =
    "block";

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

};


/* =========================
   SEARCH
   ========================= */

searchInput.addEventListener(
  "input",
  function(){

    const query =
      searchInput.value
      .trim()
      .toLowerCase();

    const items =
      chapterList.querySelectorAll(
        ".chapter-item"
      );

    items.forEach(function(item){

      const text =
        item.textContent.toLowerCase();

      item.style.display =
        text.includes(query)
        ? "flex"
        : "none";

    });

  }
);


/* =========================
   BACK BUTTON
   ========================= */

backTop.onclick = function(){

  window.location.href =
    "bookstore.html";

};


/* =========================
   DARK MODE
   ========================= */

const savedTheme =
  localStorage.getItem(
    "jr_book_theme"
  );

if(savedTheme === "dark"){

  document.body.classList.add("dark");

  themeBtn.textContent =
    "☀️";

}


themeBtn.onclick = function(){

  document.body.classList.toggle(
    "dark"
  );

  const dark =
    document.body.classList.contains(
      "dark"
    );

  localStorage.setItem(
    "jr_book_theme",
    dark ? "dark" : "light"
  );

  themeBtn.textContent =
    dark ? "☀️" : "🌙";

};


/* =========================
   INITIAL LOAD
   ========================= */

renderChapters();

</script>

</body>
</html>
