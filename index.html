<!DOCTYPE html>
<html lang="en">
<head> <link rel="manifest" href="manifest.json">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JR AI</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  overscroll-behavior: none;
  font-family: Arial, sans-serif;
  background: #c6c6c6;
}

body.dark {
  background: #181818;
}

.app {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100dvh;
  overflow: hidden;
  background: #c6c6c6;
}

body.dark .app {
  background: #181818;
}

/* HEADER */

.header {
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  height: 58px;
  min-height: 58px;
  z-index: 20;
  background: #eeeeee;
  display: flex;
  align-items: center;
  justify-content: center;
  border-bottom: 1px solid #aaa;
}

body.dark .header {
  background: #252525;
  color: white;
  border-bottom-color: #444;
}

.header-title {
  font-size: 21px;
  font-weight: bold;
}

.menu-btn {
  position: absolute;
  left: 10px;
  top: 8px;
  width: 44px;
  height: 42px;
  border: none;
  background: transparent;
  font-size: 28px;
  cursor: pointer;
  color: #222;
}

body.dark .menu-btn {
  color: white;
}

/* SIDE MENU */

.menu {
  position: fixed;
  top: 0;
  left: -285px;
  width: 285px;
  height: 100%;
  background: #eeeeee;
  z-index: 1000;
  transition: left 0.25s ease;
  box-shadow: 3px 0 12px rgba(0,0,0,0.25);
  padding-top: 20px;
}

.menu.open {
  left: 0;
}

body.dark .menu {
  background: #252525;
  color: white;
}

.menu-title {
  font-size: 22px;
  font-weight: bold;
  padding: 15px 20px;
  border-bottom: 1px solid #bbb;
}

body.dark .menu-title {
  border-bottom-color: #444;
}

.menu-item {
  width: 100%;
  border: none;
  background: transparent;
  padding: 17px 20px;
  text-align: left;
  font-size: 16px;
  cursor: pointer;
  color: #222;
}

.menu-item:hover {
  background: #d5d5d5;
}

body.dark .menu-item {
  color: white;
}

body.dark .menu-item:hover {
  background: #333;
}

.close-menu {
  position: absolute;
  right: 10px;
  top: 10px;
  border: none;
  background: transparent;
  font-size: 25px;
  cursor: pointer;
  color: inherit;
}

/* OVERLAY */

.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.35);
  z-index: 900;
  display: none;
}

.overlay.show {
  display: block;
}


/* MENU SAFETY */
.menu {
  left: -285px;
  visibility: hidden;
}
.menu.open {
  left: 0;
  visibility: visible;
}
.overlay {
  display: none;
}
.overlay.show {
  display: block;
}

/* TOOLS */

.tools {
  position: absolute;
  left: 0;
  right: 0;
  top: 58px;
  height: 58px;
  display: flex;
  gap: 8px;
  padding: 8px;
  background: #d0d0d0;
  border-bottom: 1px solid #aaa;
}

body.dark .tools {
  background: #202020;
  border-bottom-color: #444;
}

.tool-btn {
  flex: 1;
  padding: 11px 5px;
  border: none;
  border-radius: 7px;
  background: #eeeeee;
  font-weight: bold;
  cursor: pointer;
  color: #222;
}

body.dark .tool-btn {
  background: #333;
  color: white;
}

/* CHAT */

.chat {
  position: absolute;
  left: 0;
  right: 0;
  top: 116px;
  bottom: 58px;
  width: 100%;
  height: auto;
  overflow-y: scroll;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  touch-action: pan-y;
  overscroll-behavior-y: contain;
  padding: 12px;
  background: #c6c6c6;
  scroll-behavior: smooth;
}

body.dark .chat {
  background: #181818;
}

.message {
  max-width: 88%;
  padding: 11px 13px;
  margin-bottom: 10px;
  border-radius: 12px;
  line-height: 1.45;
  white-space: pre-wrap;
  word-wrap: break-word;
  font-size: 15px;
}

.message.ai {
  background: #bdbdbd;
  color: #111;
  margin-right: auto;
}

.message.user {
  background: #4a7fe8;
  color: white;
  margin-left: auto;
}

body.dark .message.ai {
  background: #333;
  color: white;
}

/* TYPING */

.typing {
  display: flex;
  gap: 5px;
  padding: 11px 14px;
  width: fit-content;
  background: #bdbdbd;
  border-radius: 12px;
  margin-bottom: 10px;
}

body.dark .typing {
  background: #333;
}

.dot {
  width: 7px;
  height: 7px;
  background: #555;
  border-radius: 50%;
  animation: blink 1.2s infinite;
}

body.dark .dot {
  background: #ddd;
}

.dot:nth-child(2) {
  animation-delay: 0.2s;
}

.dot:nth-child(3) {
  animation-delay: 0.4s;
}

@keyframes blink {
  0%, 80%, 100% {
    opacity: 0.25;
    transform: translateY(0);
  }

  40% {
    opacity: 1;
    transform: translateY(-3px);
  }
}

/* INPUT */

.bottom {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 58px;
  display: flex;
  align-items: center;
  gap: 7px;

  padding: 8px;
  background: #999999;

  z-index: 1000;
}

body.dark .bottom {
  background: #151515;
}

.input {
  flex: 1;
  min-width: 0;
  border: none;
  outline: none;
  border-radius: 8px;
  padding: 12px;
  background: #777777;
  color: white;
  font-size: 15px;
}

.input::placeholder {
  color: #dddddd;
}

.send-btn {
  width: 90px;
  height: 42px;
  flex: 0 0 90px;
  border: none;
  border-radius: 8px;
  background: #333333;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

.send-btn:disabled {
  opacity: 0.5;
}

/* HISTORY */

.history-panel {
  position: fixed;
  inset: 0;
  background: #c6c6c6;
  z-index: 1100;
  display: none;
  flex-direction: column;
}

.history-panel.show {
  display: flex;
}

body.dark .history-panel {
  background: #181818;
  color: white;
}

.history-header {
  height: 58px;
  min-height: 58px;
  display: flex;
  align-items: center;
  padding: 0 12px;
  background: #eeeeee;
  border-bottom: 1px solid #aaa;
}

body.dark .history-header {
  background: #252525;
  border-bottom-color: #444;
}

.history-header h2 {
  flex: 1;
  margin: 0;
  font-size: 20px;
}

.back-btn {
  border: none;
  background: transparent;
  font-size: 24px;
  cursor: pointer;
  color: inherit;
}

.history-list {
  flex: 1;
  overflow-y: auto;
  padding: 12px;
}

.history-card {
  background: #eeeeee;
  padding: 13px;
  border-radius: 9px;
  margin-bottom: 9px;
  cursor: pointer;
}

.history-card:hover {
  background: #dddddd;
}

body.dark .history-card {
  background: #292929;
}

body.dark .history-card:hover {
  background: #333;
}

.history-title {
  font-weight: bold;
  margin-bottom: 5px;
}

.history-preview {
  font-size: 13px;
  opacity: 0.75;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.no-history {
  text-align: center;
  opacity: 0.7;
  padding: 30px;
}

/* WHATSAPP STYLE ATTACHMENT */

.attachment-tools {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 8px;
  padding: 6px 8px;
  background: transparent;
}

.attach-btn {
  width: 42px;
  height: 42px;
  border: none;
  border-radius: 50%;
  background: #eeeeee;
  color: #222;
  font-size: 20px;
  cursor: pointer;
}


  
/* 3 DOTS MENU BUTTON */

.more-btn {
  width: 42px;
  height: 42px;
  min-width: 42px;

  position: absolute;
  right: 10px;
  top: 8px;
  

  border: none;
  border-radius: 8px;

  background: transparent;
  color: #222;

  font-size: 28px;
  line-height: 1;
  cursor: pointer;

  display: flex;
  align-items: center;
  justify-content: center;
}

.more-btn:active {
  transform: scale(0.94);
  }

  /* 3 DOTS MENU */

.more-menu {
  position: absolute;
  top: 55px;
  right: 8px;

  display: none;
  flex-direction: column;
  gap: 5px;

  min-width: 180px;
  padding: 8px;

  background: #eeeeee;
  border-radius: 12px;

  box-shadow: 0 4px 15px rgba(0,0,0,0.25);

  z-index: 3000;
}

.more-menu.show {
  display: flex;
}

.more-menu button {
  border: none;
  border-radius: 8px;
  padding: 12px;
  background: transparent;
  color: #222;
  text-align: left;
  font-size: 15px;
  cursor: pointer;
}

.more-menu button:active {
  background: #dddddd;
}

body.dark .more-btn {
  color: white;
}

body.dark .more-menu {
  background: #222;
}

body.dark .more-menu button {
  color: white;
}
  


/* ===== JR AI PREMIUM MIDNIGHT REDESIGN ===== */
:root{color-scheme:dark;--jr-bg:#070b18;--jr-panel:rgba(17,24,46,.76);--jr-line:rgba(146,164,255,.18);--jr-blue:#62a5ff;--jr-violet:#9c7bff;--jr-text:#f4f6ff;--jr-muted:#a6b0cc}
html,body{background:var(--jr-bg);color:var(--jr-text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body:not(.dark){background:var(--jr-bg);color:var(--jr-text)}
.app{background:radial-gradient(ellipse at 50% 0%,rgba(49,76,165,.18),transparent 55%),linear-gradient(145deg,#080c1b,#090d1b 55%,#100b24);isolation:isolate}
body.dark .app{background:radial-gradient(ellipse at 50% 0%,rgba(49,76,165,.18),transparent 55%),linear-gradient(145deg,#080c1b,#090d1b 55%,#100b24)}
.header{position:absolute;z-index:20;height:64px;min-height:64px;background:rgba(8,12,28,.78);color:#f7f8ff;border-bottom:1px solid rgba(135,158,255,.15);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 8px 28px rgba(0,0,0,.12)}
body.dark .header{background:rgba(8,12,28,.78);color:#f7f8ff;border-bottom-color:rgba(135,158,255,.15)}
.header-title{font-size:20px;letter-spacing:.4px;font-weight:800;background:linear-gradient(100deg,#fff 10%,#a9caff 52%,#b9a1ff 90%);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 28px rgba(94,143,255,.13)}
.menu-btn,.more-btn{color:#dfe7ff;border-radius:13px;transition:background .2s,transform .2s}
.menu-btn:hover,.more-btn:hover{background:rgba(117,145,255,.12)}
.tools{position:absolute;z-index:10;top:64px;height:60px;padding:9px 12px;background:rgba(8,12,28,.58);border-bottom:1px solid rgba(135,158,255,.1);gap:9px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
body.dark .tools{background:rgba(8,12,28,.58);border-bottom-color:rgba(135,158,255,.1)}
.tool-btn{border:1px solid rgba(144,164,255,.18);border-radius:13px;background:linear-gradient(145deg,rgba(32,43,76,.92),rgba(17,24,46,.9));color:#e8edff;font-size:11px;letter-spacing:.35px;padding:9px 5px;box-shadow:inset 0 1px rgba(255,255,255,.06),0 7px 18px rgba(0,0,0,.14);transition:transform .22s,border-color .22s,box-shadow .22s}
body.dark .tool-btn{background:linear-gradient(145deg,rgba(32,43,76,.92),rgba(17,24,46,.9));color:#e8edff}
.tool-btn:hover{transform:translateY(-2px);border-color:rgba(115,157,255,.55);box-shadow:0 8px 24px rgba(52,94,215,.17)}
.chat{position:absolute;z-index:2;top:124px;bottom:78px;padding:18px 14px 24px;background:transparent;scrollbar-width:thin;scrollbar-color:rgba(120,145,255,.35) transparent}
body.dark .chat{background:transparent}
.message{border-radius:18px;border:1px solid rgba(147,164,255,.13);box-shadow:0 10px 28px rgba(0,0,0,.12);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);line-height:1.6}
.message.ai{background:rgba(23,31,57,.88);color:#edf1ff;margin-left:0}
body.dark .message.ai{background:rgba(23,31,57,.88);color:#edf1ff}
.message.user{background:linear-gradient(135deg,#347be8,#7858e8);border-color:rgba(190,205,255,.25);box-shadow:0 8px 25px rgba(68,93,225,.22)}
.bottom{position:absolute;z-index:1000;height:78px;padding:12px 12px max(12px,env(safe-area-inset-bottom));gap:9px;background:linear-gradient(180deg,rgba(8,12,28,.06),rgba(8,12,28,.92) 32%);z-index:1000;align-items:center}
body.dark .bottom{background:linear-gradient(180deg,rgba(8,12,28,.06),rgba(8,12,28,.92) 32%)}
.input{height:49px;padding:0 17px;border:1px solid rgba(142,163,255,.23);border-radius:17px;background:rgba(20,28,51,.92);color:#f6f7ff;box-shadow:inset 0 1px rgba(255,255,255,.04),0 8px 25px rgba(0,0,0,.16);font-size:14px}
.input::placeholder{color:#8d9ab9}
.input:focus{border-color:rgba(105,151,255,.72);box-shadow:0 0 0 3px rgba(92,132,255,.11),0 8px 25px rgba(0,0,0,.18)}
.send-btn{height:48px;flex:0 0 76px;width:76px;border:1px solid rgba(186,199,255,.28);border-radius:16px;background:linear-gradient(135deg,#428cff,#8158f2);color:white;box-shadow:0 7px 24px rgba(85,98,245,.28);transition:transform .2s,filter .2s;font-size:12px;letter-spacing:.5px}
.send-btn:hover{filter:brightness(1.1);transform:translateY(-1px)}
.send-btn:active{transform:scale(.97)}
.menu{z-index:1000;background:rgba(12,17,36,.97);color:#f4f6ff;border-right:1px solid rgba(146,164,255,.2);box-shadow:15px 0 55px rgba(0,0,0,.38);backdrop-filter:blur(20px)}
body.dark .menu{background:rgba(12,17,36,.97);color:#f4f6ff}
.menu-title{border-bottom-color:rgba(146,164,255,.17);padding-top:23px;padding-bottom:19px;color:#dce7ff}
body.dark .menu-title{border-bottom-color:rgba(146,164,255,.17)}
.menu-item{color:#dbe3ff;border-radius:12px;width:calc(100% - 18px);margin:3px 9px;padding:14px 13px;transition:background .2s,color .2s}
.menu-item:hover,body.dark .menu-item:hover{background:rgba(98,132,255,.15);color:#fff}
body.dark .menu-item{color:#dbe3ff}
.close-menu,.back-btn{color:inherit}
.overlay{background:rgba(3,6,17,.62);backdrop-filter:blur(4px)}
.more-menu{background:rgba(15,22,44,.98);border:1px solid rgba(146,164,255,.2);border-radius:15px;box-shadow:0 18px 45px rgba(0,0,0,.4)}
.more-menu button,body.dark .more-menu button{color:#e7ecff;border-radius:9px}
.more-menu button:hover,.more-menu button:active{background:rgba(98,132,255,.16)}
body.dark .more-menu{background:rgba(15,22,44,.98)}
.history-panel{background:#080c1b;color:#f4f6ff}
body.dark .history-panel{background:#080c1b;color:#f4f6ff}
.history-header,body.dark .history-header{background:rgba(13,19,39,.98);border-bottom-color:rgba(146,164,255,.17)}
.history-card,body.dark .history-card{background:rgba(23,31,57,.88);border:1px solid rgba(146,164,255,.14);border-radius:14px;color:#f0f3ff}
.history-card:hover,body.dark .history-card:hover{background:rgba(38,50,88,.9)}
.typing,body.dark .typing{background:rgba(23,31,57,.88);border:1px solid rgba(146,164,255,.14)}
.dot,body.dark .dot{background:#9fbaff}
/* Ambient animated background */
.ambient{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.ambient-orb{position:absolute;border-radius:50%;filter:blur(2px);opacity:.3;mix-blend-mode:screen;animation:orbDrift 17s ease-in-out infinite alternate}
.ambient-orb.one{width:230px;height:230px;top:12%;left:-95px;background:radial-gradient(circle at 40% 40%,rgba(61,132,255,.46),rgba(74,65,211,.12) 46%,transparent 72%);animation-duration:19s}
.ambient-orb.two{width:290px;height:290px;top:32%;right:-135px;background:radial-gradient(circle at 40% 40%,rgba(155,92,255,.4),rgba(62,81,210,.1) 48%,transparent 72%);animation-duration:23s;animation-delay:-7s}
.ambient-orb.three{width:210px;height:210px;bottom:2%;left:25%;background:radial-gradient(circle,rgba(44,168,255,.2),transparent 70%);animation-duration:21s;animation-delay:-4s}
.particle-field{position:absolute;inset:0}
.particle{position:absolute;width:3px;height:3px;border-radius:50%;background:#9fc4ff;box-shadow:0 0 8px 2px rgba(104,151,255,.42);opacity:0;animation:particleFloat var(--duration,14s) linear infinite;animation-delay:var(--delay,0s)}
@keyframes orbDrift{0%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(22px,-17px,0) scale(1.06)}100%{transform:translate3d(-12px,24px,0) scale(.96)}}
@keyframes particleFloat{0%{transform:translate3d(0,22px,0) scale(.65);opacity:0}12%{opacity:.62}75%{opacity:.45}100%{transform:translate3d(var(--drift,18px),-130px,0) scale(1.15);opacity:0}}
/* Centered welcome / hero */
.landing-hero{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px 5px 24px;animation:heroEnter .65s ease both}
.hero-mark{width:66px;height:66px;border-radius:23px;display:grid;place-items:center;margin:0 auto 19px;font-size:31px;background:linear-gradient(145deg,rgba(54,110,234,.35),rgba(121,79,224,.25));border:1px solid rgba(158,181,255,.35);box-shadow:inset 0 1px rgba(255,255,255,.16),0 0 34px rgba(74,113,255,.2),0 15px 32px rgba(0,0,0,.22);transform:perspective(400px) rotateX(8deg) rotateY(-8deg);animation:markFloat 5s ease-in-out infinite}
.hero-eyebrow{font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:#9db8ff;font-weight:800;margin-bottom:11px}
.hero-title{margin:0;font-size:clamp(29px,7.6vw,43px);line-height:1.08;letter-spacing:-1.5px;font-weight:850;color:#f8f9ff}
.hero-title span{display:block;background:linear-gradient(100deg,#75b7ff 10%,#9a8cff 55%,#d0a8ff 95%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(113,125,255,.16))}
.hero-subtitle{max-width:320px;margin:15px auto 23px;font-size:13px;line-height:1.65;color:#a9b4d0}
.hero-prompt-label{font-size:10px;letter-spacing:1.3px;text-transform:uppercase;color:#8190b4;margin-bottom:10px}
.hero-prompts{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:365px;margin:0 auto}
.hero-prompt{border:1px solid rgba(140,161,255,.2);background:linear-gradient(145deg,rgba(28,39,72,.72),rgba(17,24,46,.78));color:#dce6ff;border-radius:999px;padding:10px 12px;font-size:11px;box-shadow:inset 0 1px rgba(255,255,255,.04);cursor:pointer;transition:transform .2s,border-color .2s,background .2s}
.hero-prompt:hover{transform:translateY(-2px);border-color:rgba(133,164,255,.6);background:rgba(40,54,97,.9)}
.hero-footnote{font-size:10px;color:#6f7d9e;margin-top:20px;letter-spacing:.25px}
@keyframes heroEnter{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
@keyframes markFloat{0%,100%{transform:perspective(400px) rotateX(8deg) rotateY(-8deg) translateY(0)}50%{transform:perspective(400px) rotateX(4deg) rotateY(5deg) translateY(-5px)}}
@media(min-width:700px){.chat{padding-left:max(24px,calc((100% - 760px)/2));padding-right:max(24px,calc((100% - 760px)/2))}.landing-hero{max-width:760px;margin:auto}.hero-title{font-size:48px}.hero-subtitle{font-size:14px}.tool-btn{font-size:12px}}
@media(max-height:650px){.landing-hero{justify-content:flex-start;padding-top:22px}.hero-mark{width:50px;height:50px;border-radius:17px;font-size:24px;margin-bottom:12px}.hero-subtitle{margin:10px auto 14px}.hero-footnote{margin-top:12px}.hero-title{font-size:30px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}.particle-field{display:none}}


/* ===== INPUT / MOBILE KEYBOARD POLISH ===== */
.bottom{left:0;right:0;box-sizing:border-box;padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right))}
.input{min-width:0;flex:1;appearance:none;-webkit-appearance:none;touch-action:manipulation}
.input:focus{outline:none}
.send-btn{white-space:nowrap;touch-action:manipulation}
@media (max-width:380px){
  .bottom{gap:7px;padding-left:9px;padding-right:9px}
  .input{padding-left:12px;padding-right:12px;font-size:14px}
  .send-btn{width:66px;flex-basis:66px;font-size:11px}

/* =========================================

const API_URL =

/* =========================================
   ELEMENTS
========================================= */

const chat =

/* =========================================
   VARIABLES
========================================= */

let isSending = false;

let currentChat = [];

let savedChats = [];

let currentChatId = null;

const HISTORY_KEY =
  "jr_ai_chat_history";

const USER_KEY =
  "jr_ai_user_id";


/* =========================================
   USER ID
========================================= */

let userId =
  localStorage.getItem(USER_KEY);

if (!userId) {

  userId =
    "user_" +
    Date.now() +
    "_" +
    Math.random()
      .toString(36)
      .slice(2);

  localStorage.setItem(
    USER_KEY,
    userId
  );

}


/* =========================================
   LOAD HISTORY
========================================= */

function loadHistory() {

  try {

    const data =
      localStorage.getItem(
        HISTORY_KEY
      );

    if (data) {

      const parsed =
        JSON.parse(data);

      if (
        Array.isArray(parsed)
      ) {

        savedChats = parsed;

      } else {

        savedChats = [];

      }

    } else {

      savedChats = [];

    }

  } catch (error) {

    savedChats = [];

  }
  
  }

/* =========================================
   SAVE HISTORY
========================================= */

function saveHistory() {

  try {

    localStorage.setItem(
      HISTORY_KEY,
      JSON.stringify(savedChats)
    );

  } catch (error) {

    console.log(
      "History save error:",
      error
    );

  }

}


/* =========================================
   SAVE CURRENT CHAT
========================================= */

function saveCurrentChat() {

  if (
    currentChat.length === 0
  ) {

    return;

  }


  const firstUserMessage =
    currentChat.find(
      function(item) {

        return item.type === "user";

      }
    );


  const title =
    firstUserMessage &&
    firstUserMessage.text
      ? firstUserMessage.text.slice(
          0,
          45
        )
      : "JR AI Chat";


  if (!currentChatId) {

    currentChatId =
      Date.now().toString() +
      "_" +
      Math.random()
        .toString(36)
        .slice(2);

  }


  const chatData = {

    id:
      currentChatId,

    title:
      title,

    messages:
      JSON.parse(
        JSON.stringify(
          currentChat
        )
      ),

    updatedAt:
      Date.now()

  };


  const index =
    savedChats.findIndex(
      function(item) {

        return (
          item.id ===
          currentChatId
        );

      }
    );


  if (index >= 0) {

    savedChats[index] =
      chatData;

  } else {

    savedChats.unshift(
      chatData
    );

  }


  /* Maximum 50 chats */

  savedChats =
    savedChats.slice(
      0,
      50
    );


  saveHistory();

}


/* =========================================
   RENDER HISTORY
========================================= */

function renderHistory() {

  historyList.innerHTML = "";


  if (
    savedChats.length === 0
  ) {

    const empty =
      document.createElement(
        "div"
      );

    empty.className =
      "no-history";

    empty.textContent =
      "No chat history yet.";

    historyList.appendChild(
      empty
    );

    return;

  }


  const sorted =
    savedChats
      .slice()
      .sort(
        function(a, b) {

          return (
            (b.updatedAt || 0) -
            (a.updatedAt || 0)
          );

        }
      );


  sorted.forEach(
    function(item) {

      const card =
        document.createElement(
          "div"
        );

      card.className =
        "history-card";


      const title =
        document.createElement(
          "div"
        );

      title.className =
        "history-title";

      title.textContent =
        item.title ||
        "JR AI Chat";


      const preview =
        document.createElement(
          "div"
        );

      preview.className =
        "history-preview";


      const messages =
        Array.isArray(
          item.messages
        )
          ? item.messages
          : [];


      const last =
        messages.length
          ? messages[
              messages.length - 1
            ]
          : null;


      preview.textContent =
        last && last.text
          ? last.text
          : "Empty chat";


      card.appendChild(
        title
      );

      card.appendChild(
        preview
      );


      card.addEventListener(
        "click",
        function() {

          openSavedChat(
            item.id
          );

        }
      );


      historyList.appendChild(
        card
      );

    }
  );

}


/* =========================================
   OPEN SAVED CHAT
========================================= */

function openSavedChat(id) {

  const found =
    savedChats.find(
      function(item) {

        return item.id === id;

      }
    );


  if (!found) {

    return;

  }


  currentChatId =
    found.id;


  currentChat =
    Array.isArray(
      found.messages
    )
      ? JSON.parse(
          JSON.stringify(
            found.messages
          )
        )
      : [];


  chat.innerHTML = "";


  currentChat.forEach(
    function(item) {

      addMessage(
        item.text,
        item.type,
        false
      );

    }
  );


  closeHistory();

  closeSideMenu();

  scrollToBottom();

  messageInput.focus({ preventScroll: true });

}


/* =========================================
   ADD MESSAGE
========================================= */

function addMessage(
  text,
  type,
  shouldRecord
) {

  const landingHero = document.getElementById("landingHero");
  if (landingHero) landingHero.remove();

  const message =
    document.createElement(
      "div"
    );

  message.className =
    "message " +
    type;

  chat.appendChild(
    message
  );

  if (
    shouldRecord
  ) {

    currentChat.push({

      type:
        type,

      text:
        text

    });

  }

  // AI ka normal answer dheere-dheere show hoga
  if (
    type === "ai" &&
    shouldRecord
  ) {

    let i = 0;

    function typeNext() {

      if (
        i < text.length
      ) {

        message.textContent +=
          text.slice(
            i,
            i + 3
          );

        i += 3;

        scrollToBottom();

        setTimeout(
          typeNext,
          15
        );

      }

    }

    typeNext();

  } else {

    message.textContent =
      text;

    scrollToBottom();

  }

      }

/* =========================================
   TYPING INDICATOR
========================================= */

function showTyping() {

  hideTyping();


  const typing =
    document.createElement(
      "div"
    );

/* =========================================
   SCROLL
========================================= */

function scrollToBottom() {

  if (!chat) return;

  requestAnimationFrame(function() {
    chat.scrollTo({
      top: chat.scrollHeight,
      behavior: "smooth"
    });

/* =========================================
   JR AI FOUNDER / OWNER INFORMATION
========================================= */

function getJrAiIdentityAnswer(message) {
  const question = message
    .toLowerCase()
    .replace(/[^\p{L}\p{M}\p{N}\s]/gu, " ")
    .replace(/\s+/g, " ")
    .trim();

  // Match identity questions in English, Hindi, and Hinglish,
  // even when the user does not mention "JR AI" explicitly.
  const roleQuestion = question
    .replace(/\bco\s*founder\b/g, "cofounder")
    .replace(/सह\s*संस्थापक/g, " ");

  const asksAboutCoFounder =
    /\bco\s*[- ]?founder\b/.test(question) ||
    /\bcofounder\b/.test(question) ||
    question.includes("सह संस्थापक") ||
    question.includes("सह-संस्थापक") ||
    question.includes("को फाउंडर") ||
    question.includes("को-फाउंडर") ||
    question.includes("सह-संस्थापक कौन");

  const asksAboutFounderOwnerCreator =
    /\bfounder\b/.test(roleQuestion) ||
    /\bfounded\b/.test(roleQuestion) ||
    /\bcreator\b/.test(roleQuestion) ||
    /\bcreated\b/.test(roleQuestion) ||
    /\bowner\b/.test(roleQuestion) ||
    /\b(made|built|developed|started|launched)\b/.test(roleQuestion) ||
    /\bmalik\b/.test(question) ||
    /\bbanaya\b/.test(question) ||
    /\bkisne\s+(is\s+)?(app\s+)?banaya\b/.test(question) ||
    /\bbanane wala\b/.test(question) ||
    question.includes("फाउंडर") ||
    question.includes("क्रिएटर") ||
    question.includes("ओनर") ||
    question.includes("संस्थापक") ||
    question.includes("निर्माता") ||
    question.includes("मालिक") ||
    question.includes("किसने बनाया") ||
    question.includes("किसने बनाया है") ||
    question.includes("किसने बनाया था") ||
    question.includes("बनाने वाला");

  if (!asksAboutCoFounder && !asksAboutFounderOwnerCreator) {
    return null;
  }

  const isHindiScript = /[\u0900-\u097F]/.test(message);
  const isHinglish =
    /\b(kon|kaun|hai|hain|ka|ki|ke|kya|batao|banaaya|banaya|malik|kisne|kaun hai|kaun hain|founder kaun)\b/.test(question);

  // Consistent answers in English, Hindi, and Hinglish; no robot emoji before names.
  if (asksAboutCoFounder && asksAboutFounderOwnerCreator) {
    if (isHindiScript) {
      return "JR AI के संस्थापक, निर्माता और मालिक Rohan Raj हैं, और सह-संस्थापक Jiya Kumari हैं।";
    }
    return isHinglish
      ? "JR AI ke founder, creator aur owner Rohan Raj hain, aur co-founder Jiya Kumari hain."
      : "Rohan Raj is the founder, creator, and owner of JR AI. Jiya Kumari is the co-founder.";
  }

  if (asksAboutCoFounder) {
    if (isHindiScript) {
      return "JR AI की सह-संस्थापक Jiya Kumari हैं।";
    }
    return isHinglish
      ? "JR AI ki co-founder Jiya Kumari hain."
      : "Jiya Kumari is the co-founder of JR AI.";
  }

  if (isHindiScript) {
    return "JR AI के संस्थापक, निर्माता और मालिक Rohan Raj हैं।";
  }
  return isHinglish
    ? "JR AI ke founder, creator aur owner Rohan Raj hain."
    : "Rohan Raj is the founder, creator, and owner of JR AI.";
}


/* =========================================
   SEND MESSAGE
========================================= */

async function sendMessage() {

  if (isSending) {
    return;
  }

  const message =
    messageInput.value.trim();

  if (!message) {
    return;
  }

  // Answer JR AI co-founder questions locally in the user's language.
  const identityAnswer =
    getJrAiIdentityAnswer(message);

  if (identityAnswer) {
    addMessage(message, "user", true);
    messageInput.value = "";
    addMessage(identityAnswer, "ai", true);
    saveCurrentChat();
    return;
  }

  isSending = true;
  sendBtn.disabled = true;
  messageInput.disabled = true;

  addMessage(
    message,
    "user",
    true
  );

  messageInput.value = "";

  showTyping();

  const controller =
    new AbortController();

  /*
   * Gemini + Apps Script ko
   * response dene ke liye enough time
   */
  const timeout =
    setTimeout(
      function() {
        controller.abort();
      },
      60000
    );

  try {

    const response =
      await fetch(
        API_URL,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "text/plain;charset=utf-8"
          },

          body: JSON.stringify({
            message: message,
            userId: userId
          }),

          signal:
            controller.signal
        }
      );

    clearTimeout(timeout);

    if (!response.ok) {

      throw new Error(
        "Server error: " +
        response.status
      );

    }

    const data =
      await response.json();

    hideTyping();

    if (
      data &&
      data.error
    ) {

      addMessage(
        "⚠️ " + data.error,
        "ai",
        false
      );

      return;
    }

    const answer =
      data &&
      data.answer
        ? String(
            data.answer
          ).trim()
        : "";

    if (!answer) {

      addMessage(
        "⚠️ AI ne empty response diya. Please try again.",
        "ai",
        false
      );

      return;
    }

    addMessage(
      answer,
      "ai",
      true
    );

    saveCurrentChat();

  } catch (error) {

    clearTimeout(timeout);

    hideTyping();

    let errorText =
      "⚠️ Kuch problem aa gayi. Please try again.";

    if (
      error &&
      error.name ===
        "AbortError"
    ) {

      errorText =
        "⚠️ Server response me zyada time lag raha hai. Please try again.";

    } else if (
      error &&
      error.message
    ) {

      errorText =
        "⚠️ " +
        error.message;

    }

    addMessage(
      errorText,
      "ai",
      false
    );

  } finally {

    isSending = false;

    sendBtn.disabled = false;

    messageInput.disabled = false;

    messageInput.focus({ preventScroll: true });

    scrollToBottom();

  }

  }

/* =========================================
   SHARE CHAT
========================================= */

async function shareChat() {

  closeSideMenu();


  let messagesToShare =
    currentChat.slice();


  if (
    messagesToShare.length === 0
  ) {

    const visibleMessages =
      document.querySelectorAll(
        ".chat .message"
      );


    visibleMessages.forEach(
      function(message) {

        const type =
          message.classList.contains(
            "user"
          )
            ? "user"
            : "ai";


        const text =
          message.textContent.trim();


        if (text) {

          messagesToShare.push({

            type:
              type,

            text:
              text

          });

        }

      }
    );

  }


  if (
    messagesToShare.length === 0
  ) {

    alert(
      "Abhi share karne ke liye chat empty hai."
    );

    return;

  }


  const shareText =
    messagesToShare
      .map(
        function(item) {

          const sender =
            item.type === "user"
              ? "YOU"
              : "JR AI";


          return (
            sender +
            ":\n" +
            item.text
          );

        }
      )
      .join("\n\n");


  const finalShareText =
    "🤖 JR AI CHAT\n\n" +
    shareText;


  /* NATIVE SHARE */

  if (
    navigator.share &&
    typeof navigator.share ===
      "function"
  ) {

    try {

      await navigator.share({

        title:
          "JR AI Chat",

        text:
          finalShareText

      });

      return;

    } catch (error) {

      if (
        error &&
        error.name ===
          "AbortError"
      ) {

        return;

      }

    }

  }


  /* CLIPBOARD */

  try {

    if (
      navigator.clipboard &&
      navigator.clipboard.writeText
    ) {

      await navigator.clipboard.writeText(
        finalShareText
      );


      alert(
        "✅ Chat copy ho gayi hai.\nAb jahan chahe paste karke share kar do."
      );

      return;

    }

  } catch (error) {

    /* fallback */

  }


  /* OLD COPY FALLBACK */

  const textArea =
    document.createElement(
      "textarea"
    );


  textArea.value =
    finalShareText;


  textArea.style.position =
    "fixed";

  textArea.style.left =
    "-9999px";

  textArea.style.top =
    "0";


  document.body.appendChild(
    textArea
  );


  textArea.focus();

  textArea.select();


  try {

    document.execCommand(
      "copy"
    );


    alert(
      "✅ Chat copy ho gayi hai.\nAb jahan chahe paste karke share kar do."
    );

  } catch (error) {

    alert(
      "❌ Chat copy nahi ho paayi."
    );

  }


  document.body.removeChild(
    textArea
  );

}

/* Gentle floating particles (kept lightweight for mobile) */
(function createAmbientParticles() {
  const field = document.getElementById("particleField");
  if (!field || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const count = window.innerWidth < 520 ? 20 : 32;
  for (let i = 0; i < count; i++) {
    const particle = document.createElement("span");
    particle.className = "particle";
    particle.style.left = (Math.random() * 100) + "%";
    particle.style.top = (15 + Math.random() * 85) + "%";
    particle.style.setProperty("--duration", (10 + Math.random() * 12) + "s");
    particle.style.setProperty("--delay", (-Math.random() * 18) + "s");
    particle.style.setProperty("--drift", ((Math.random() * 70) - 35) + "px");
    if (i % 5 === 0) { particle.style.width = "4px"; particle.style.height = "4px"; }
    field.appendChild(particle);
  }
})();
