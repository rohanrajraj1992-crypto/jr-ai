<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JR AI</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6f8;
}

.header{
  background:#111827;
  color:white;
  padding:18px;
  text-align:center;
  font-size:24px;
  font-weight:bold;
}

#chat{
  height:calc(100vh - 145px);
  overflow-y:auto;
  padding:15px;
}

.msg{
  max-width:82%;
  padding:12px 15px;
  margin:10px 0;
  border-radius:17px;
  line-height:1.5;
  white-space:pre-wrap;
}

.user{
  margin-left:auto;
  background:#2563eb;
  color:white;
}

.ai{
  margin-right:auto;
  background:white;
  color:#111827;
  box-shadow:0 1px 5px #ddd;
}

.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:white;
  padding:10px;
  display:flex;
  gap:8px;
}

input{
  flex:1;
  padding:13px;
  border:1px solid #ccc;
  border-radius:22px;
  font-size:16px;
  outline:none;
}

button{
  border:0;
  border-radius:22px;
  padding:0 18px;
  background:#2563eb;
  color:white;
  font-weight:bold;
}

button:disabled{
  opacity:.6;
}
</style>
</head>

<body>

<div class="header">🤖 JR AI</div>

<div id="chat">
  <div class="msg ai">
    Hello! 👋 Main JR AI hoon. Kuch bhi pucho.
  </div>
</div>

<div class="bottom">
  <input id="message" placeholder="Type your message...">
  <button id="sendBtn" onclick="sendMessage()">SEND</button>
</div>

<script>

const BACKEND_URL =
"https://script.google.com/macros/s/AKfycbw_JLLyocUc5-w6p32H5OKefve1nCr97iUGKmleTJqB-QuA443PrisNr-pdgTUkbHXn/exec";

async function sendMessage(){

  const input = document.getElementById("message");
  const chat = document.getElementById("chat");
  const button = document.getElementById("sendBtn");

  const message = input.value.trim();

  if(!message) return;

  chat.innerHTML +=
    '<div class="msg user">' +
    escapeHtml(message) +
    '</div>';

  input.value="";
  button.disabled=true;

  const ai=document.createElement("div");
  ai.className="msg ai";
  ai.textContent="JR AI soch raha hai...";
  chat.appendChild(ai);

  chat.scrollTop=chat.scrollHeight;

  try{

    const response=await fetch(BACKEND_URL,{
      method:"POST",
      headers:{
        "Content-Type":"text/plain;charset=utf-8"
      },
      body:JSON.stringify({
        message:message
      })
    });

    const data=await response.json();

    if(data.candidates &&
       data.candidates[0] &&
       data.candidates[0].content &&
       data.candidates[0].content.parts){

      ai.textContent=
        data.candidates[0].content.parts[0].text;

    }else if(data.error){

      ai.textContent=
        "Gemini Error: "+JSON.stringify(data.error);

    }else{

      ai.textContent="AI response nahi mila.";

    }

  }catch(error){

    ai.textContent=
      "Connection problem: "+error.message;

  }

  button.disabled=false;
  chat.scrollTop=chat.scrollHeight;
}

function escapeHtml(text){
  const div=document.createElement("div");
  div.textContent=text;
  return div.innerHTML;
}

</script>

</body>
</html>
