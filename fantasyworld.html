const chapterGrid =
document.getElementById("chapterGrid");

const chapterSection =
document.getElementById("chapterSection");

const reader =
document.getElementById("reader");

const chapterContent =
document.getElementById("chapterContent");

const searchInput =
document.getElementById("searchInput");

const prevBtn =
document.getElementById("prevBtn");

const nextBtn =
document.getElementById("nextBtn");

const chapterBtn =
document.getElementById("chapterBtn");

const progressText =
document.getElementById("progressText");

const progressPercent =
document.getElementById("progressPercent");

const progressFill =
document.getElementById("progressFill");

const themeBtn =
document.getElementById("themeBtn");

const backBtn =
document.getElementById("backBtn");


let currentIndex = 0;


function renderChapters(list){

  chapterGrid.innerHTML = "";

  list.forEach(function(chapter){

    const originalIndex =
      chapters.indexOf(chapter);

    const card =
      document.createElement("div");

    card.className =
      "chapter-card";

    card.innerHTML = `

      <div class="chapter-number">
        ${originalIndex + 1}
      </div>

      <h3>
        ${chapter.title}
      </h3>

      <p>
        Read chapter ${originalIndex + 1}
      </p>

    `;

    card.addEventListener(
      "click",
      function(){

        openChapter(originalIndex);

      }
    );

    chapterGrid.appendChild(card);

  });

}


function openChapter(index){

  if(
    index < 0 ||
    index >= chapters.length
  ){

    return;

  }

  currentIndex = index;

  chapterSection.style.display =
    "none";

  reader.classList.add("active");

  chapterContent.innerHTML =
    chapters[index].content;

  updateNavigation();

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


function showChapters(){

  reader.classList.remove("active");

  chapterSection.style.display =
    "block";

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


function updateNavigation(){

  progressText.textContent =
    "Chapter " +
    (currentIndex + 1) +
    " of " +
    chapters.length;

  const percentage =
    Math.round(
      ((currentIndex + 1) /
      chapters.length) * 100
    );

  progressPercent.textContent =
    percentage + "%";

  progressFill.style.width =
    percentage + "%";

  prevBtn.disabled =
    currentIndex === 0;

  nextBtn.disabled =
    currentIndex ===
    chapters.length - 1;

}


function searchChapters(){

  const query =
    searchInput.value
      .toLowerCase()
      .trim();

  if(!query){

    renderChapters(chapters);

    return;

  }

  const filtered =
    chapters.filter(function(chapter){

      return chapter.title
        .toLowerCase()
        .includes(query);

    });

  renderChapters(filtered);

}


prevBtn.addEventListener(
  "click",
  function(){

    if(currentIndex > 0){

      openChapter(
        currentIndex - 1
      );

    }

  }
);


nextBtn.addEventListener(
  "click",
  function(){

    if(
      currentIndex <
      chapters.length - 1
    ){

      openChapter(
        currentIndex + 1
      );

    }

  }
);


chapterBtn.addEventListener(
  "click",
  showChapters
);


themeBtn.addEventListener(
  "click",
  function(){

    document.body.classList.toggle(
      "dark"
    );

    const isDark =
      document.body.classList.contains(
        "dark"
      );

    localStorage.setItem(
      "jr_ai_theme",
      isDark ? "dark" : "light"
    );

    themeBtn.textContent =
      isDark ? "☀️" : "🌙";

  }
);


backBtn.addEventListener(
  "click",
  function(){

    window.location.href =
      "bookstore.html";

  }
);


function loadTheme(){

  const savedTheme =
    localStorage.getItem(
      "jr_ai_theme"
    );

  if(savedTheme === "dark"){

    document.body.classList.add(
      "dark"
    );

    themeBtn.textContent =
      "☀️";

  }

}


searchInput.addEventListener(
  "input",
  searchChapters
);


loadTheme();

renderChapters(chapters);

updateNavigation();

</script>
