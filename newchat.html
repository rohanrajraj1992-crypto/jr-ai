<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JR AI - New Chat</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  height: 100%;
  font-family: Arial, sans-serif;
  background: #c6c6c6;
}

.app {
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.header {
  height: 58px;
  min-height: 58px;
  background: #999999;
  display: flex;
  align-items: center;
  padding: 0 12px;
  font-weight: bold;
}

.back-btn {
  border: none;
  background: transparent;
  font-size: 28px;
  cursor: pointer;
  margin-right: 10px;
}

.header-title {
  font-size: 18px;
}

.chat {
  flex: 1;
  overflow-y: auto;
  padding: 12px;
}

.message {
  max-width: 90%;
  padding: 12px 14px;
  margin-bottom: 10px;
  border-radius: 12px;
  white-space: pre-wrap;
  line-height: 1.5;
  word-wrap: break-word;
}

.message.ai {
  background: #bdbdbd;
  color: #111;
  margin-right: auto;
}

.message.user {
  background: #4a7fe8;
  color: white;
  margin-left: auto;
}

.bottom {
  display: flex;
  gap: 8px;
  padding: 10px;
  background: #999999;
}

.input {
  flex: 1;
  min-width: 0;
  border: none;
  outline: none;
  border-radius: 10px;
  padding: 13px;
  background: #777777;
  color: white;
  font-size: 15px;
}

.input::placeholder {
  color: #eeeeee;
}

.send-btn {
  border: none;
  border-radius: 10px;
  padding: 0 16px;
  background: #333333;
  color: white;
  font-weight: bold;
}

.typing {
  display: flex;
  gap: 5px;
  padding: 12px;
}

.dot {
  width: 7px;
  height: 7px;
  background: #555;
  border-radius: 50%;
  animation: blink 1s infinite;
}

.dot:nth-child(2) {
  animation-delay: .2s;
}

.dot:nth-child(3) {
  animation-delay: .4s;
}

@keyframes blink {
  0%, 80%, 100% {
    opacity: .3;
  }

  40% {
    opacity: 1;
  }
}
</style>
</head>

<body>

<div class="app">

  <div class="header">

    <button
      class="back-btn"
      id="backBtn"
      type="button"
    >←</button>

    <div class="header-title">
      🤖 JR AI — NEW CHAT
    </div>

  </div>

  <div
    class="chat"
    id="chat"
  ></div>

  <div class="bottom">

    <input
      id="messageInput"
      class="input"
      type="text"
      placeholder="What's your new topic today 🤔♾️"
      autocomplete="off"
    >

    <button
      id="sendBtn"
      class="send-btn"
      type="button"
    >
      SEND
    </button>

  </div>

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbwyW1sNFAI9lgYH_7_FWng44IWUUrbIadwPMRM6vrmw84C8w41rWvBkACuIAasVmAHT/exec";

const chat =
document.getElementById("chat");

const messageInput =
document.getElementById("messageInput");

const sendBtn =
document.getElementById("sendBtn");

const backBtn =
document.getElementById("backBtn");

let isSending = false;

const USER_KEY =
"jr_ai_user_id";

function getUserId() {

  let userId =
    localStorage.getItem(
      USER_KEY
    );

  if (!userId) {

    userId =
      "jr_" +
      Date.now() +
      "_" +
      Math.random()
        .toString(36)
        .slice(2);

    localStorage.setItem(
      USER_KEY,
      userId
    );

  }

  return userId;

}

function scrollToBottom() {

  requestAnimationFrame(
    function() {

      chat.scrollTop =
        chat.scrollHeight;

    }
  );

}

function addMessage(
  text,
  type
) {

  const message =
    document.createElement(
      "div"
    );

  message.className =
    "message " +
    type;

  chat.appendChild(
    message
  );

  if (
    type === "ai"
  ) {

    let i = 0;

    function typeNext() {

      if (
        i < text.length
      ) {

        message.textContent +=
          text.slice(
            i,
            i + 3
          );

        i += 3;

        scrollToBottom();

        setTimeout(
          typeNext,
          15
        );

      }

    }

    typeNext();

  } else {

    message.textContent =
      text;

    scrollToBottom();

  }

}

function showTyping() {

  const typing =
    document.createElement(
      "div"
    );

  typing.className =
    "typing";

  typing.id =
    "typingIndicator";

  for (
    let i = 0;
    i < 3;
    i++
  ) {

    const dot =
      document.createElement(
        "div"
      );

    dot.className =
      "dot";

    typing.appendChild(
      dot
    );

  }

  chat.appendChild(
    typing
  );

  scrollToBottom();

}

function hideTyping() {

  const typing =
    document.getElementById(
      "typingIndicator"
    );

  if (typing) {

    typing.remove();

  }

}

async function sendMessage() {

  if (
    isSending
  ) {
    return;
  }

  const text =
    messageInput.value.trim();

  if (!text) {

    messageInput.focus();

    return;

  }

  isSending = true;

  sendBtn.disabled =
    true;

  messageInput.disabled =
    true;

  addMessage(
    text,
    "user"
  );

  messageInput.value = "";

  showTyping();

  const controller =
    new AbortController();

  const timeout =
    setTimeout(
      function() {

        controller.abort();

      },
      60000
    );

  try {

    const response =
      await fetch(
        API_URL,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "text/plain;charset=utf-8"
          },

          body: JSON.stringify({

            message:
              text,

            userId:
              getUserId()

          }),

          signal:
            controller.signal

        }
      );

    const data =
      await response.json();

    clearTimeout(
      timeout
    );

    hideTyping();

    if (
      data &&
      data.error
    ) {

      addMessage(
        "⚠️ " +
        data.error,
        "ai"
      );

      return;

    }

    const answer =
      data &&
      data.answer
        ? String(
            data.answer
          ).trim()
        : "";

    if (!answer) {

      addMessage(
        "⚠️ AI ne empty response diya. Please try again.",
        "ai"
      );

      return;

    }

    addMessage(
      answer,
      "ai"
    );

  } catch (error) {

    clearTimeout(
      timeout
    );

    hideTyping();

    addMessage(
      "⚠️ Kuch problem aa gayi. Please try again.",
      "ai"
    );

  } finally {

    isSending =
      false;

    sendBtn.disabled =
      false;

    messageInput.disabled =
      false;

    messageInput.focus();

  }

}

backBtn.addEventListener(
  "click",
  function() {

    window.location.href =
      "index.html";

  }
);

sendBtn.addEventListener(
  "click",
  function() {

    sendMessage();

  }
);

messageInput.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "Enter"
    ) {

      event.preventDefault();

      sendMessage();

    }

  }
);

addMessage(
  "👋 Hey! Welcome to JR AI 🤖✨\nWhat are we learning today? 📚",
  "ai"
);
  
/* =========================================
   GLOBAL THEME
========================================= */

function applyGlobalTheme() {

  const savedTheme =
    localStorage.getItem("jr_ai_theme") || "light";

  if (savedTheme === "dark") {
    document.body.classList.add("dark");
  } else {
    document.body.classList.remove("dark");
  }

}

applyGlobalTheme();
  
</script>

</body>
</html>
