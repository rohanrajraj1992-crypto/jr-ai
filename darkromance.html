];


let currentIndex = 0;


const chapterGrid =
  document.getElementById("chapterGrid");

const chapterSection =
  document.getElementById("chapterSection");

const reader =
  document.getElementById("reader");

const chapterLabel =
  document.getElementById("chapterLabel");

const chapterTitle =
  document.getElementById("chapterTitle");

const storyContent =
  document.getElementById("storyContent");

const prevBtn =
  document.getElementById("prevBtn");

const nextBtn =
  document.getElementById("nextBtn");

const progressText =
  document.getElementById("progressText");

const progressBar =
  document.getElementById("progressBar");

const searchInput =
  document.getElementById("searchInput");


function renderChapters(list = chapters){

  chapterGrid.innerHTML = "";

  if(list.length === 0){

    chapterGrid.innerHTML =
      '<div class="empty">No chapters found.</div>';

    return;
  }

  list.forEach(function(chapter){

    const originalIndex =
      chapters.indexOf(chapter);

    const card =
      document.createElement("div");

    card.className =
      "chapter-card";

    card.innerHTML = `
      <div class="chapter-number">
        ${originalIndex + 1}
      </div>

      <h3>
        ${chapter.title}
      </h3>

      <p>
        Open this chapter and continue reading.
      </p>
    `;

    card.addEventListener(
      "click",
      function(){
        openChapter(originalIndex);
      }
    );

    chapterGrid.appendChild(card);

  });

}


function openChapter(index){

  if(
    index < 0 ||
    index >= chapters.length
  ){
    return;
  }

  currentIndex = index;

  const chapter =
    chapters[currentIndex];

  chapterSection.style.display =
    "none";

  reader.classList.add("active");

  chapterLabel.textContent =
    "Chapter " + (currentIndex + 1);

  chapterTitle.textContent =
    chapter.title;

  storyContent.innerHTML =
    chapter.content;

  updateNavigation();

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


function showChapters(){

  reader.classList.remove("active");

  chapterSection.style.display =
    "block";

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


function updateNavigation(){

  progressText.textContent =
    "Chapter " +
    (currentIndex + 1) +
    " of " +
    chapters.length;

  const percentage =
    ((currentIndex + 1) /
    chapters.length) * 100;

  progressBar.style.width =
    percentage + "%";

  prevBtn.disabled =
    currentIndex === 0;

  nextBtn.disabled =
    currentIndex === chapters.length - 1;

}


function previousChapter(){

  if(currentIndex > 0){

    openChapter(
      currentIndex - 1
    );

  }

}


function nextChapter(){

  if(
    currentIndex <
    chapters.length - 1
  ){

    openChapter(
      currentIndex + 1
    );

  }

}


function searchChapters(){

  const query =
    searchInput.value
      .trim()
      .toLowerCase();

  if(query === ""){

    renderChapters();

    return;

  }

  const filtered =
    chapters.filter(function(chapter){

      return chapter.title
        .toLowerCase()
        .includes(query);

    });

  renderChapters(filtered);

}


function toggleTheme(){

  document.body.classList.toggle("light");

  const theme =
    document.body.classList.contains("light")
      ? "light"
      : "dark";

  localStorage.setItem(
    "jr_dark_romance_theme",
    theme
  );

}


function loadTheme(){

  const theme =
    localStorage.getItem(
      "jr_dark_romance_theme"
    );

  if(theme === "light"){

    document.body.classList.add("light");

  }

}


function goBack(){

  window.location.href =
    "bookstore.html";

}


loadTheme();

renderChapters();

</script>

</body>
</html>
